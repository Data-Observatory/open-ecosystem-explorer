name: CI

# Runs on every pull request and every push to main. No AWS credentials, no OIDC token, no
# deployment: the deploy workflow (deploy.yml) starts after this one succeeds on main.
# Third-party actions are pinned by commit SHA (same pins as deploy.yml, see its header).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run lint

      # The knowledge graph: schema, 35 invariants, EN/ES parity. Errors fail the job.
      - run: npm run validate

      # The committed map layout matches the graph (regenerate with npm run layout:generate).
      - run: npm run layout:check

      # Unit tests, with the 100% thresholds for src/lib/graph and src/lib/invariants.
      - run: npm run test:coverage

      # prebuild runs validate and layout:check again; postbuild fixes 404.html.
      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The infra tests read the staged static build.
      - run: npm run build

      - run: npm ci
        working-directory: infra

      - run: npx tsc --noEmit
        working-directory: infra

      - run: npx vitest run
        working-directory: infra

      # Synth with dummy values only: no AWS credentials and no deployment in CI.
      - run: ./node_modules/.bin/cdk synth -c domainName=oee.example.test --quiet
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: '111111111111'
          CDK_DEFAULT_REGION: us-east-1
