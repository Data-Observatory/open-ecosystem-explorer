name: Deploy

# Runs after every green CI run on main, and only while the repository variable DEPLOY_ENABLED is
# 'true' (set it to anything else to pause deploys). The setup is in infra/README.md
# ("Deploy workflow: setup"). No account id or ARN is stored here:
# the role comes from a secret, the region, the domain and the logging options from variables.
# Two jobs: "diff" runs the checks, builds the site and writes the cdk diff to the job summary
# (environment production-diff); "deploy" (environment production) publishes the build artifact
# made by "diff". Neither environment has required reviewers: main is protected (a pull request
# and the CI checks are needed), so a deploy follows a merged, green pull request. Both
# environments accept runs from main only.
# Third-party actions are pinned by commit SHA (checked against each action's repository):
#   actions/checkout v4.3.1, actions/setup-node v4.4.0, actions/upload-artifact v4.6.2,
#   actions/download-artifact v4.3.0, aws-actions/configure-aws-credentials v6.3.0

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One run at a time; a run in progress is never cancelled.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  diff:
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    environment: production-diff
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit that passed CI. Empty for a manual run, which uses the default ref.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run lint

      - run: npm run validate

      - run: npm run layout:check

      - run: npm test

      # The public origin is baked into the sitemap, the feeds, robots.txt and the canonical links.
      - name: Build the site
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: SITE_URL="https://$SITE_DOMAIN" npm run build

      # Installed before the AWS credentials exist, so install scripts never see them.
      - name: Install the infra packages
        working-directory: infra
        run: npm ci

      - name: Type-check the infra code
        working-directory: infra
        run: npx tsc --noEmit

      - name: Test the infra code
        working-directory: infra
        run: npx vitest run

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Review the changes
        working-directory: infra
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          ACCESS_LOGS: ${{ vars.ACCESS_LOGS }}
          ACCESS_LOG_RETENTION_DAYS: ${{ vars.ACCESS_LOG_RETENTION_DAYS }}
        run: |
          ./node_modules/.bin/cdk diff --no-color -c domainName="$SITE_DOMAIN" -c accessLogs="$ACCESS_LOGS" -c accessLogRetentionDays="$ACCESS_LOG_RETENTION_DAYS" 2>&1 | tee cdk-diff.txt
          {
            echo '## cdk diff'
            echo
            echo '```'
            cat cdk-diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The reviewed build is the build that the deploy job publishes.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-build
          path: build
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: diff
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installed before the AWS credentials exist, so install scripts never see them.
      - name: Install the infra packages
        working-directory: infra
        run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build
          path: build

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy
        working-directory: infra
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          ACCESS_LOGS: ${{ vars.ACCESS_LOGS }}
          ACCESS_LOG_RETENTION_DAYS: ${{ vars.ACCESS_LOG_RETENTION_DAYS }}
        run: ./node_modules/.bin/cdk deploy --require-approval never -c domainName="$SITE_DOMAIN" -c accessLogs="$ACCESS_LOGS" -c accessLogRetentionDays="$ACCESS_LOG_RETENTION_DAYS"
