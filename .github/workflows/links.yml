name: Link check

# Every Monday (and on demand): requests every http(s) URL in src/content with HEAD, GET as
# fallback, and keeps one open issue, labelled link-check, with the report. Only HEAD and GET
# requests go out; nothing is submitted anywhere. Sites that refuse scripts (401, 403, 429) are
# listed apart and do not open an issue by themselves. Actions are pinned by commit SHA (same pins
# as ci.yml). The report is also in the job log. Run it by hand with: npm run links

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The script exits 0 whether or not the report has findings.
      - name: Run the link check
        run: npm run links

      - name: Create or update the link-check issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create link-check --description "Weekly link report" --color 0e8a16 2>/dev/null || true
          existing=$(gh issue list --label link-check --state open --limit 1 --json number --jq '.[0].number // empty')
          # GitHub allows 65536 characters in an issue body.
          head -c 60000 link-report.md > link-report-issue.md
          if grep -qx 'No findings\.' link-report.md; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "The link check of $(date -u +%Y-%m-%d) has no findings. This issue is left open for a maintainer to close."
            fi
          elif [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file link-report-issue.md
            gh issue comment "$existing" --body "Report updated by the link check of $(date -u +%Y-%m-%d)."
          else
            gh issue create --title "Link check report" --label link-check --body-file link-report-issue.md
          fi
