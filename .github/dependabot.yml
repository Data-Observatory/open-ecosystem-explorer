# Weekly update pull requests. Each one is an ordinary pull request: CI runs on it, a person reads
# the diff and merges it (rebase merge), and a merge to main deploys like any other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    ignore:
      # Major upgrades that need a decision of their own (see issue #46).
      - dependency-name: '@sveltejs/kit'
        update-types: ['version-update:semver-major']
      - dependency-name: '@sveltejs/adapter-static'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: '@inlang/paraglide-js'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(infra-deps)'
      prefix-development: 'chore(infra-deps-dev)'
    ignore:
      # Types stay on the Node major the deploy runs on; TypeScript 7 breaks ts-node (issue #46).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']
