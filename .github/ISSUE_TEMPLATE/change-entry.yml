name: Change an entry or a relation / Corregir una entrada o una relación
description: Something is wrong, outdated or missing in an entry, in a relation between entries or in a translation. / Algo es incorrecto, está desactualizado o falta.
title: '[Change] '
labels: ['change-entry']
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Write in English or Spanish. A maintainer turns an accepted proposal into a reviewed change; you do not need to edit any file.
        Las propuestas son públicas. Escribe en español o en inglés. Una persona del equipo convierte la propuesta aceptada en un cambio revisado; no necesitas editar archivos.
  - type: input
    id: entity
    attributes:
      label: Entry / Entrada
      description: The entry id from its address (for example `doi`) or its name. / El id de la entrada en su dirección (por ejemplo `doi`) o su nombre.
    validations:
      required: true
  - type: dropdown
    id: what
    attributes:
      label: What needs to change? / ¿Qué hay que cambiar?
      options:
        - A fact or a definition is wrong / Un dato o una definición es incorrecta
        - A relation is wrong or missing / Una relación es incorrecta o falta
        - Information is out of date / La información está desactualizada
        - The translation is poor or missing / La traducción es deficiente o falta
        - A link or a source is broken / Un enlace o una fuente no funciona
        - Something else / Otra cosa
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details / Detalle
      description: What does the entry say now, and what should it say? / ¿Qué dice ahora la entrada y qué debería decir?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source URL / URL de la fuente
      description: Where this can be checked. A change without a source may wait until one is found. / Dónde se puede comprobar. Un cambio sin fuente puede esperar hasta encontrarla.
    validations:
      required: false
