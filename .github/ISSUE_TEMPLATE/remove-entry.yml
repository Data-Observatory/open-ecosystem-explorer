name: Remove an entry / Quitar una entrada
description: An entry does not belong on the map, is a duplicate or is not true. For one connection, use the connection form. / Una entrada no corresponde al mapa, está duplicada o no es cierta. Para una sola conexión, usa el formulario de conexión.
title: '[Remove] '
labels: ['remove-entry']
body:
  - type: markdown
    attributes:
      value: |
        Issues are public: do not include personal data. Write in English or Spanish. A maintainer checks the source and makes the change; you do not need to edit any file. No GitHub account? Write to contacto@dataobservatory.net.
        Las propuestas son públicas: no incluyas datos personales. Escribe en español o en inglés. Una persona del equipo revisa la fuente y hace el cambio; no necesitas editar archivos. ¿Sin cuenta de GitHub? Escribe a contacto@dataobservatory.net.
  - type: input
    id: entity
    attributes:
      label: Entry / Entrada
      description: The entry id from its address (for example `doi`) or its name. / El id de la entrada en su dirección (por ejemplo `doi`) o su nombre.
    validations:
      required: true
  - type: dropdown
    id: reason
    attributes:
      label: Why? / ¿Por qué?
      options:
        - It is not true / No es cierta
        - It is a duplicate of another entry / Está duplicada con otra entrada
        - It is out of scope / Está fuera del alcance
        - It no longer exists / Ya no existe
        - Something else / Otra razón
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details and evidence / Detalle y evidencia
      description: A link to evidence helps. If in doubt we leave it out, but removing an entry also removes its connections, so we check first. / Un enlace a la evidencia ayuda. Quitar una entrada también quita sus conexiones, así que revisamos antes.
    validations:
      required: true
