# The 21 relation predicates (specs.md Appendix A.2). Canonical direction is
# subject -> object, subject being the entity described (C2). Inverses are
# derived at build time, never authored (I7). Single source for I6-I10 and the
# predicate table on the About page. `family` (vocab/predicate-families.yaml)
# is display metadata only. `pending: true` exempts a predicate from I12 (>=1 edge)
# until its first edge is authored.
# Labels are read as the sentence "<subject> <label> <object>" (inverseLabel:
# "<object> <inverseLabel> <subject>"), so each one carries its own verb and,
# in Spanish, avoids gendered forms where a neutral one exists ("es un tipo de",
# not "es un/a").
issues:
  family: behind
  label: { es: emite, en: issues }
  inverseLabel: { es: emitido por, en: issued by }
  domain: [agency]
  range: [identifier]
  symmetric: false
  acyclic: false
  sameTypeOnly: false
  maxOutDegree: 5

implements:
  family: builds-on
  label: { es: implementa, en: implements }
  inverseLabel: { es: implementado por, en: implemented by }
  domain: [repository, cris, index, aggregator, publishing-platform, agency]
  range: [standard]
  symmetric: false
  acyclic: false
  sameTypeOnly: false
  maxOutDegree: 5

complies-with:
  family: builds-on
  label: { es: cumple con, en: complies with }
  inverseLabel: { es: cumplido por, en: complied with by }
  domain: [identifier, agency, index, cris, repository, aggregator, publishing-platform, standard, community, coalition, policy, organization]
  range: [standard, policy]
  symmetric: false
  acyclic: false
  sameTypeOnly: false
  maxOutDegree: 5

depends-on:
  family: builds-on
  label: { es: depende de, en: depends on }
  inverseLabel: { es: del que dependen, en: depended on by }
  domain: [identifier, agency, index, cris, repository, aggregator, publishing-platform, standard]
  range: [standard, agency, identifier, repository]
  symmetric: false
  acyclic: true
  sameTypeOnly: false
  maxOutDegree: 5

interoperates-with:
  family: connects
  label: { es: interopera con, en: interoperates with }
  inverseLabel: { es: interopera con, en: interoperates with }
  domain: [index, aggregator, repository, cris, publishing-platform]
  range: [index, aggregator, repository, cris, publishing-platform]
  symmetric: true
  acyclic: false
  sameTypeOnly: true
  # crossTypePairs is a constrained escape hatch from sameTypeOnly (kept
  # narrow deliberately, not opened wholesale, so I8 still catches typos):
  # cris<->index integrations are real, common product-suite pairings (Pure
  # <-> Scopus, Converis/Esploro <-> Web of Science, Symplectic Elements <->
  # Dimensions) that sameTypeOnly alone made unauthorable. index<->
  # publishing-platform covers real regional coordination between directory
  # services and journal platforms (Latindex <-> Redalyc/SciELO) that is
  # otherwise unauthorable.
  crossTypePairs: [[cris, index], [index, publishing-platform]]
  maxOutDegree: 8

owned-by:
  family: behind
  label: { es: es propiedad de, en: owned by }
  inverseLabel: { es: posee, en: owns }
  domain: [identifier, agency, index, cris, repository, aggregator, publishing-platform, organization]
  range: [organization]
  symmetric: false
  acyclic: true
  sameTypeOnly: false
  maxOutDegree: 3

governed-by:
  family: behind
  label: { es: gobernado por, en: governed by }
  inverseLabel: { es: gobierna, en: governs }
  domain: [identifier, agency, index, cris, repository, aggregator, publishing-platform, standard, community, coalition, policy]
  # Range widened beyond A.2's literal [organization, community, coalition] to
  # include `agency`: Appendix B's worked example governs a standard by the
  # agency that publishes it (DataCite Metadata Schema governed-by DataCite),
  # which is a common real pattern the memo itself describes [M§3] and A.2
  # appears to have omitted rather than deliberately excluded. Judgment call,
  # flagged for review.
  range: [organization, community, coalition, agency]
  symmetric: false
  acyclic: false
  sameTypeOnly: false
  maxOutDegree: 3

operated-by:
  family: behind
  label: { es: operado por, en: operated by }
  inverseLabel: { es: opera, en: operates }
  domain: [identifier, agency, index, cris, repository, aggregator, publishing-platform]
  # Range widened beyond A.2's literal [organization, community] to include
  # `agency` and `aggregator`: real day-to-day operators are routinely
  # agencies (ROR is operated by DataCite, alongside Crossref and CDL — a
  # fact the schema previously could not express) or aggregators (Zenodo
  # operated by OpenAIRE alongside CERN). Same rationale as governed-by's
  # earlier widening below.
  range: [organization, community, agency, aggregator]
  symmetric: false
  acyclic: false
  sameTypeOnly: false
  maxOutDegree: 3

developed-by:
  family: behind
  label: { es: desarrollado por, en: developed by }
  inverseLabel: { es: desarrolla, en: develops }
  # Domain widened to include `index`: e.g. Wikidata's day-to-day development
  # is led by Wikimedia Deutschland, distinct from the Wikimedia Foundation's
  # operated-by role hosting its infrastructure — a real, common split for
  # community-run indices that the narrower domain made unauthorable.
  domain: [repository, cris, standard, identifier, publishing-platform, index]
  # Range widened for the same reason as operated-by: e.g. the OpenAIRE
  # Guidelines are developed by OpenAIRE itself (an aggregator), which the
  # narrower range made unauthorable.
  range: [organization, community, agency, aggregator]
  symmetric: false
  acyclic: false
  sameTypeOnly: false
  maxOutDegree: 3

funded-by:
  family: behind
  label: { es: financiado por, en: funded by }
  inverseLabel: { es: financia, en: funds }
  domain: [identifier, agency, index, cris, repository, aggregator, publishing-platform, standard, community, coalition, policy, organization]
  range: [organization, coalition]
  symmetric: false
  acyclic: false
  sameTypeOnly: false
  maxOutDegree: 5

member-of:
  family: connects
  label: { es: es miembro de, en: is a member of }
  inverseLabel: { es: tiene como miembro a, en: has member }
  # Domain widened beyond the original [organization, repository, aggregator,
  # publishing-platform, agency, index] to include `community`, `coalition`
  # and `standard`: real, documented affiliate-membership facts exist between
  # communities/coalitions themselves (e.g. CODATA, a community, is a
  # documented Affiliate Member of RDA) and were previously unauthorable —
  # same rationale as operated-by/developed-by/governed-by's earlier
  # widenings above. Judgment call, flagged for review.
  domain: [organization, repository, aggregator, publishing-platform, agency, index, community, coalition, standard]
  # Range widened (owner decision, from the Wikidata cross-check) to include
  # `agency` and `organization`: membership organisations are routinely
  # registration agencies or plain organisations, not only communities or
  # coalitions. DataCite is an `agency` whose members include Crossref, CERN,
  # arXiv and others; the International DOI Foundation is an `organization`
  # whose members are the DOI registration agencies. Declaration signatories
  # are not members: they are `endorsed-by` (see that predicate).
  range: [community, coalition, aggregator, agency, organization]
  symmetric: false
  acyclic: true
  sameTypeOnly: false
  maxOutDegree: 8

part-of:
  family: connects
  label: { es: es parte de, en: is part of }
  inverseLabel: { es: tiene como parte a, en: has part }
  domain: [identifier, agency, index, cris, repository, aggregator, publishing-platform, standard, community, coalition, policy, organization, concept]
  range: [identifier, agency, index, cris, repository, aggregator, publishing-platform, standard, community, coalition, policy, organization, concept]
  symmetric: false
  acyclic: true
  sameTypeOnly: true
  maxOutDegree: 1

supersedes:
  family: shapes
  label: { es: reemplaza a, en: supersedes }
  inverseLabel: { es: reemplazado por, en: superseded by }
  domain: [identifier, agency, index, cris, repository, aggregator, publishing-platform, standard, community, coalition, policy, organization, concept]
  range: [identifier, agency, index, cris, repository, aggregator, publishing-platform, standard, community, coalition, policy, organization, concept]
  symmetric: false
  acyclic: true
  sameTypeOnly: true
  maxOutDegree: 3

profile-of:
  family: builds-on
  label: { es: es un perfil de, en: is a profile of }
  inverseLabel: { es: tiene como perfil a, en: has profile }
  domain: [standard]
  range: [standard]
  symmetric: false
  acyclic: true
  sameTypeOnly: false
  maxOutDegree: 3

indexes:
  family: connects
  label: { es: indexa, en: indexes }
  inverseLabel: { es: indexado por, en: indexed by }
  domain: [index, aggregator, publishing-platform]
  range: [repository, aggregator, index, publishing-platform]
  symmetric: false
  acyclic: false
  sameTypeOnly: false
  maxOutDegree: 8

certified-by:
  family: builds-on
  label: { es: certificado por, en: certified by }
  inverseLabel: { es: certifica, en: certifies }
  domain: [repository, aggregator, publishing-platform]
  range: [organization, community, standard]
  symmetric: false
  acyclic: false
  sameTypeOnly: false
  maxOutDegree: 5

endorsed-by:
  family: shapes
  label: { es: respaldado por, en: endorsed by }
  inverseLabel: { es: respalda, en: endorses }
  domain: [standard, policy, coalition]
  # Range widened to every type that can publicly sign or support: this is
  # also the signatory convention (owner decision). Declarations and
  # initiatives (DORA, Barcelona Declaration, ...) are `endorsed-by` their
  # signatories/supporters, authored on the declaration; `member-of` is kept
  # for genuine organisational membership (CoARA, RDA, COAR, W3C, ...).
  # Infrastructure signatories are agencies, aggregators and indexes (Crossref,
  # DataCite, OpenAIRE, OpenAlex, OpenCitations on the Barcelona Declaration),
  # which the narrower range made unauthorable.
  range: [organization, community, coalition, agency, aggregator, index, repository, publishing-platform, cris]
  symmetric: false
  acyclic: false
  sameTypeOnly: false
  maxOutDegree: 8

mandates:
  family: shapes
  label: { es: exige, en: mandates }
  inverseLabel: { es: exigido por, en: mandated by }
  domain: [policy, coalition]
  range: [standard, identifier, policy]
  symmetric: false
  acyclic: false
  sameTypeOnly: false
  maxOutDegree: 5

applies-to:
  family: shapes
  label: { es: aplica a, en: applies to }
  inverseLabel: { es: sujeto a, en: subject to }
  domain: [policy]
  range: [organization, repository, cris, aggregator, publishing-platform]
  symmetric: false
  acyclic: false
  sameTypeOnly: false
  maxOutDegree: 8

is-a:
  family: kind
  label: { es: es un tipo de, en: is a kind of }
  inverseLabel: { es: incluye a, en: includes }
  # Classification: any entity (or a more specific concept) is-a concept. The
  # range is always `concept`; the domain is every type, so concept -> concept
  # (subtype: 'diamond open access' is-a 'open access') and thing -> concept
  # ('DOI' is-a 'persistent identifier') both type-check. Acyclic (a DAG, so a
  # concept may have several parents); transitivity is NOT required — consumers
  # follow the chain themselves, the validator never infers.
  domain: [identifier, agency, index, cris, repository, aggregator, publishing-platform, standard, community, coalition, policy, organization, concept]
  range: [concept]
  symmetric: false
  acyclic: true
  sameTypeOnly: false
  maxOutDegree: 3

related-to:
  family: kind
  label: { es: se relaciona con, en: relates to }
  inverseLabel: { es: se relaciona con, en: relates to }
  # Association with a concept where `is-a` would be wrong (the thing operates,
  # practises or addresses the idea but is not a kind of it: SciELO relates to
  # diamond open access, FAIR relates to research data management). Range is
  # always `concept`; the domain is every type, so thing -> concept and
  # concept <-> concept both type-check. Symmetric: a concept <-> concept pair
  # is authored once, on the lexicographically smaller id (I9); a thing ->
  # concept edge is always authored on the thing (the reverse direction is not
  # a legal edge, so I9 does not apply). Every edge carries a short `note`
  # saying HOW the two relate; maxOutDegree 5 keeps it a curated pointer.
  domain: [identifier, agency, index, cris, repository, aggregator, publishing-platform, standard, community, coalition, policy, organization, concept]
  range: [concept]
  symmetric: true
  acyclic: false
  sameTypeOnly: false
  maxOutDegree: 5
