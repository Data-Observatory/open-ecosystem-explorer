summary: POSI is a set of 20 principles for the governance, sustainability and insurance of the organisations that run scholarly infrastructure. It is not a standard.
body: |-
  The Principles of Open Scholarly Infrastructure (POSI) are principles for the organisations that run scholarly infrastructure, not a technical standard or a certification. Version 2.0 (October 2025) has 20 principles in three groups: governance (including a "living will" for what happens if the organisation winds down), sustainability, and insurance (open source, open and secure data, patent non-assertion and interoperability with open standards). Organisations adopt them by publishing a self-audit and committing to show evidence of following them; Crossref adopted them by board vote and has published periodic self-assessments (2020, 2022 and 2024).
