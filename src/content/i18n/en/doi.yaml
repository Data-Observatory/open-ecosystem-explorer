summary: Persistent identifier for an object — article, dataset, report, platform or software — that resolves to its current location.
relationNotes:
  depends-on@handle-system: DOI names are Handles; resolution runs on the Handle System.
localNote: In Chile, Data Observatory leads a DataCite consortium through which its members can register DOIs.
body: |-
  A DOI is assigned through a registration agency such as Crossref or DataCite, and resolves through the Handle System.
