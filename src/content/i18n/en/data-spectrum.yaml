summary: The Data Spectrum is an Open Data Institute tool that shows data on a range from closed through
  shared to open, not as a yes-or-no choice.
relationNotes:
  related-to@open-data: Places open data at one end of a range that runs from closed through shared to
    open.
body: The Open Data Institute's Data Spectrum is a tool for understanding the language of data, from closed
  data through shared data to open data. Access is treated as a range, not a yes-or-no choice. The graphics
  are published under a CC-BY licence; they, not this page's text, give the exact steps of the scale.
