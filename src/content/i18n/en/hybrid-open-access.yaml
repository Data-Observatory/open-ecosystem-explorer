summary: Hybrid open access means one article in a subscription journal is made open at once, under an
  open licence, for a fee.
body: In hybrid open access an article is published in a subscription journal but is immediately free
  to read under an open licence, in exchange for an article processing charge (APC) paid by the authors
  or their institution. The journal still sells subscriptions, so an institution can pay for the same
  journal twice.
