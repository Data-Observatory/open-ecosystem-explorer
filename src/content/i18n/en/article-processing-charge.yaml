summary: An article processing charge (APC) is a fee a journal charges, usually paid
  by authors or funders, to publish an article in open access.
relationNotes:
  related-to@open-access: A fee-based way to fund open access publishing.
body: |-
  APCs are the best-known way to pay for open access in full open access and hybrid journals. Diamond journals, by contrast, charge neither readers nor authors.
