summary: Not-for-profit international society for optics and photonics, based in Bellingham, Washington, USA.
body: |-
  SPIE describes itself as a not-for-profit society that serves researchers, educators and industry in light-based science and technology. It is headquartered in Bellingham, Washington, USA.

  It appears here because The Lens, the patent and scholarly index, is a wholly owned subsidiary of SPIE since its June 2026 sale by Cambia (see The Lens).
