summary: The Open Data Charter is a network that helps governments adopt six international open data principles, the first being open by default.
relationNotes:
  related-to@open-data: Principles for releasing government data openly.
body: |-
  The principles were developed in 2015 by governments, civil society and experts. According to its site, more than 29 national and 146 sub-national governments and cities have adopted them.
localNote: Chile was among the original signatories when the Charter was adopted in October 2015 in Mexico.
