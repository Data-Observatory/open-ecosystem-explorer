summary: ARK is a persistent identifier that is free to issue, used by libraries,
  archives and data repositories to link stably to their objects.
relationNotes:
  funded-by@lyrasis: The community-governed ARK Alliance is supported in part by LYRASIS.
body: |-
  ARK is an alternative to the DOI that costs nothing to issue. It is popular with libraries, archives and some data repositories. It is governed by the ARK Alliance, a technical community that coordinates the institutions issuing identifiers and maintains the registry of institution prefixes (NAAN) and the N2T resolver, which redirects each identifier to its current object.
