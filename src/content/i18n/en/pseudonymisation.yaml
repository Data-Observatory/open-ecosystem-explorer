summary: Pseudonymisation processes personal data so that they cannot be attributed to a person without
  extra information kept apart.
body: Pseudonymisation replaces direct identifiers so that data cannot be attributed to a person without
  additional information, which must be kept separately under technical and organisational safeguards.
  The additional information can restore the link, which is the difference from anonymisation. Chile's
  Law 21.719 defines it and lists it among the security measures for personal data.
