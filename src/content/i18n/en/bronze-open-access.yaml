summary: Bronze open access means an article is free to read on the publisher site, with no open licence
  that allows reuse.
body: Bronze articles are free to read on the publisher's website but carry no explicit open licence.
  They are not published in journals counted as open access in the DOAJ, and, unlike hybrid articles,
  they show no licence information. Without a licence they allow reading but not clearly any further reuse,
  and the study notes it is not clear whether they stay free to read temporarily or permanently. The term
  was proposed in a 2018 study of how much of the literature is open.
