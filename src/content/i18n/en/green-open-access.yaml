summary: Green open access means an article published in a subscription journal is also deposited in an
  open repository.
relationNotes:
  related-to@preprint: The archived copy may be the published version or a preprint.
  related-to@institutional-repository: Green articles are self-archived in a disciplinary or an institutional
    repository.
body: In green open access an article is published in a journal that is not open and is also self-archived
  in an open repository, either a disciplinary one such as arXiv or an institutional repository run by
  a university. The archived copy may be the published version or a preprint. Most green copies do not
  meet the Budapest definition of open access, because they do not extend reuse rights.
