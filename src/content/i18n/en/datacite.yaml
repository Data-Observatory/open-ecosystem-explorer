summary: Nonprofit DOI registration agency focused on datasets, software, reports and research platforms.
relationNotes:
  member-of@international-doi-foundation: 'Registration Agency member of the DOI Foundation.'
  issues@doi: €2,000 membership plus an infrastructure fee of €200–700, scaled to context; no charge per DOI below 100,000 a year.
  issues@igsn: IGSNs for physical samples are issued as a DataCite record type.
localNote: In Chile, DataCite consortia are led by Data Observatory and by the University of Chile library system (SISIB).
body: |-
  DataCite works with consortia, organised by region or by service, and issues the DOI for datasets and other research objects.
