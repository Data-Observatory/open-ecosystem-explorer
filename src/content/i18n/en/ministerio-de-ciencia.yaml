summary: Chilean ministry for science, technology, knowledge and innovation, created in 2018; ANID relates
  to the President through it.
shortName: MinCiencia
body: The Ministry of Science, Technology, Knowledge and Innovation was created by Law 21.105 of 2018.
  ANID, the agency that runs the research funding programmes, relates to the President of the Republic
  through it. Under Law 21.838 the Ministry, with the Ministry of Economy, issues the regulation that
  sets the terms of use of the national repository.
