summary: UK non-profit that ran DOAJ before its handover to the DOAJ Foundation, due to complete in mid-2026.
body: |-
  IS4OA kept DOAJ going as a curated index of open access journals until the operation passed to the DOAJ Foundation. According to doaj.org/about, it would continue to operate until mid-2026, when the transition would be complete; we have found no confirmation that it has closed.
