summary: COAR Notify is a set of community conventions that lets repositories send
  notices to external services, such as peer review, and receive theirs.
relationNotes:
  related-to@peer-review: Lets repositories and review services exchange review notifications.
body: |-
  COAR Notify defines profiles and conventions built on the W3C's Linked Data Notifications, so a repository can alert external services (peer review, overlay journals) and receive alerts from them. It is not a harvesting protocol and does not replace OAI-PMH.
