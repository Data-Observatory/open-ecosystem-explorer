summary: CLACSO's forum for debating how research is assessed in Latin America and the Caribbean, with
  a formal start in November 2019.
shortName: FOLEC
relationNotes:
  governed-by@clacso: A CLACSO forum; its formal start was in Mexico City in November 2019.
  related-to@research-assessment: Debates the meaning, policies and practices of research assessment in
    Latin America.
body: FOLEC is a space for debate on the meanings, policies and practices of research assessment in the
  region, from an open, collaborative and public perspective on knowledge. Its formal start was the first
  Latin American seminar on research assessment, held in Mexico City in November 2019 and co-organised
  by CLACSO. In 2020 it produced diagnoses, proposals and guiding principles on assessment reform, and
  in 2021 a second forum took place with CONICET of Argentina. It is a forum and a declaration of principles,
  not a coalition whose signatories report progress.
