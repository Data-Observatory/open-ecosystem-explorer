summary: Bibliodiversity is the variety of publishers, languages, formats and publishing
  models that lets knowledge circulate without depending on a few actors.
localNote: The term is linked to independent publishers in Chile and Latin America
  in the 1990s, though its exact origin is disputed.
relationNotes:
  related-to@open-science: Diverse, multilingual publishing is part of the open science
    agenda.
body: |-
  The Jussieu Call (2017) applies the term to scholarly publishing, arguing for diverse, non-commercial and multilingual models. The Helsinki Initiative on Multilingualism addresses the language side of the same concern.
