summary: Persistent identifier that solves the problem of the same researcher appearing under different written forms of their name.
body: |-
  The ORCID iD is the person identifier most widely adopted in research worldwide; it unambiguously links a researcher to their publications, datasets and funding. It is issued and run by ORCID, Inc., an independent nonprofit that manages the registry, maintains the interoperability standards and is funded by membership fees, without depending on any publisher or funder.
