summary: Chilean law of 2018 that created the Ministry of Science and ANID, the agency that runs the programmes
  funding research.
shortName: Law 21.105
relationNotes:
  applies-to@ministerio-de-ciencia: Creates the Ministry of Science, Technology, Knowledge and Innovation.
  applies-to@anid: Art. 11 creates ANID as a decentralised public service linked to the President through
    the Ministry.
body: Law 21.105 was published on 13 August 2018. It created the Ministerio de Ciencia, Tecnología, Conocimiento
  e Innovación and, in article 11, the Agencia Nacional de Investigación y Desarrollo (ANID) as a decentralised
  public service with its own legal personality, related to the President through the Ministry. ANID's
  purpose is to administer and run the programmes and instruments that promote research in all areas of
  knowledge.
