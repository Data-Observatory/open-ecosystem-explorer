summary: 2012 declaration against using the journal impact factor as a substitute for the
  quality of an individual article.
relationNotes:
  endorsed-by@elsevier: Signed in December 2020, after years of pressure from the community.
  related-to@research-assessment: Declaration on how research should be assessed.
body: |-
  DORA is the founding declaration of the research assessment reform movement. It came before more recent coalitions such as CoARA.
