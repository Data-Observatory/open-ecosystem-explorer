summary: DORA is a 2012 declaration asking that an article not be judged by the impact
  factor (average citations) of its journal.
relationNotes:
  endorsed-by@elsevier: Signed in December 2020, after years of pressure from the community.
  related-to@research-assessment: Declaration on how research should be assessed.
body: |-
  DORA is the declaration that started the research assessment reform movement. It came before more recent coalitions such as CoARA.
