summary: Cooperative electronic publishing programme that hosts, marks up and publishes sixteen national journal collections.
relationNotes:
  funded-by@fapesp: Created SciELO in 1997; since August 2024 it has co-funded it (47%) with CAPES (48%) and CNPq (5%) through a national consortium.
  related-to@diamond-open-access: Runs journals under the diamond model.
body: |-
  SciELO does not harvest metadata from elsewhere the way OpenAIRE or LA Referencia do: it hosts the full text, applies its own admission criteria and does the editorial markup.
