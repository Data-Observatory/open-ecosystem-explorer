summary: Global instrument adopted by UNESCO member states in 2021; advisory in nature, and the reference text that most regional policies cite.
relationNotes:
  mandates@fair: Advisory only. It names FAIR (and CARE) as guiding principles for open data and infrastructure, without creating a binding obligation.
body: |-
  It is advisory, not binding, but works as the common framework that national policies, such as ANID's in Chile, refer to.
