summary: The Open Source Initiative is a US nonprofit, founded in 1998, that maintains the Open Source Definition and approves licences that comply with it.
relationNotes:
  related-to@open-source-software: Maintains the definition and the approved-licence list for open source.
  related-to@open-license: Approves licences that comply with the Open Source Definition.
body: |-
  It is a California public benefit corporation with 501(c)(3) status. It educates about and advocates for open source and runs the OSI Approved License programme.
