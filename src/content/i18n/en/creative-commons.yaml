summary: Creative Commons is a US nonprofit that publishes the Creative Commons licences and the CC0 public-domain tool for sharing work openly.
relationNotes:
  related-to@open-license: Steward of the Creative Commons licence suite, the best-known family of open licences.
body: |-
  Creative Commons was founded in 2001 and describes itself as the nonprofit behind the world's most widely used open licences. Its licences give reuse permission in advance, and CC0 is a public-domain dedication.
