summary: An open science policy is a formal framework setting rules and support for
  sharing publications and data, adopted by a state, funder or institution.
localNote: We found no standalone national open-science policy in Chile; the instrument
  in force is ANID's open-access policy, and several universities have their own.
body: |-
  The UNESCO Recommendation on Open Science (2021) is the global reference instrument. Policies may be adopted at national, funder or institutional level.
