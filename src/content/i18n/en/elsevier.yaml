summary: Commercial publisher that owns Scopus, Pure, Interfolio and Digital Commons (bepress) — one index, one CRIS and two repository platforms in the same portfolio.
relationNotes:
  owned-by@relx: Elsevier is a division of RELX.
body: |-
  Elsevier is the most cited example of vertical integration: it owns the index (Scopus), the CRIS (Pure) and the repository platforms (Interfolio, Digital Commons) that many institutions use to record and assess their own research.
