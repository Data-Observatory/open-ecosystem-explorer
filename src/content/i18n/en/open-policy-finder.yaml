summary: Open Policy Finder is a Jisc service for looking up the open access policies
  of publishers and funders; it merges three earlier Sherpa services.
relationNotes:
  operated-by@jisc: Operated by Jisc.
  supersedes@sherpa-romeo: Launched on 4 November 2024, merging Sherpa Romeo, Juliet and Fact into a single service.
body: |-
  Open Policy Finder brings the open access policies of publishers and funders together in one place, replacing the three separate Sherpa services. It launched on 4 November 2024.
