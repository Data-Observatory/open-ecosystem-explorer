summary: Jisc service launched on 4 November 2024 that merges Sherpa Romeo, Juliet and Fact into a single policy index.
relationNotes:
  operated-by@jisc: Operated by Jisc.
  supersedes@sherpa-romeo: Launched on 4 November 2024, merging Sherpa Romeo, Juliet and Fact into a single service.
body: |-
  Open Policy Finder brings the open access policies of publishers and funders together in one place, replacing the three separate Sherpa services.
