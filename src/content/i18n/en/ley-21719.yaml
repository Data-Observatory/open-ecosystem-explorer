summary: Chilean law of 2024 that rewrites Law 19.628 on personal data and creates the Agencia de Protección
  de Datos Personales.
shortName: Law 21.719
relationNotes:
  related-to@personal-data: Defines personal data as information about an identified or identifiable natural
    person.
  related-to@anonymisation: Anonymisation is irreversible, and anonymised data stops being personal data.
  related-to@pseudonymisation: Defines pseudonymisation and lists it among the security measures for personal
    data.
  related-to@research-data-management: The right to object does not apply to research processing that
    a public function or public interest needs.
body: Law 21.719 was published on 13 December 2024. It reforms Law 19.628, which becomes the law on the
  protection of personal data, and creates the Agencia de Protección de Datos Personales. It defines personal
  data, anonymisation and pseudonymisation, and sets out the rights of the people the data are about.
  For research, it says anonymised data is no longer personal data, and that the right to object does
  not apply to research processing that a public function or a public-interest activity needs. A transitional
  article sets when the reform enters into force; check LeyChile for the date currently in force.
