summary: Sherpa Romeo was a service that showed what authors could deposit under each
  publisher's policy; it is now part of Open Policy Finder.
relationNotes:
  operated-by@jisc: Operated by Jisc until it was merged into Open Policy Finder.
body: |-
  Sherpa Romeo listed publishers' self-archiving policies, that is, what authors may deposit and when. On 4 November 2024 the service was replaced by Open Policy Finder, which merged Romeo, Juliet and Fact into a single tool.
