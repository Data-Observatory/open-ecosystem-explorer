summary: Historical service listing open access publisher policies, merged into Open
  Policy Finder on 4 November 2024.
relationNotes:
  operated-by@jisc: Operated by Jisc until it was merged into Open Policy Finder.
body: |-
  Sherpa Romeo listed publishers' self-archiving policies. The service was replaced by Open Policy Finder, which merged Romeo, Juliet and Fact into a single tool.
