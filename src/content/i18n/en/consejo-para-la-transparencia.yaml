summary: Autonomous Chilean public body created by Law 20.285 to promote transparency and guarantee the
  right of access to public information.
shortName: Transparency Council
body: The Consejo para la Transparencia is an autonomous public-law corporation with its own legal personality
  and assets, created by article 31 of Law 20.285. Its purpose is to promote the transparency of public
  functions, oversee compliance with the rules on transparency and publicity of information, and guarantee
  the right of access to information. Among its functions it resolves complaints about denied access to
  information.
