summary: The California Digital Library is a collaborative library of the University
  of California that operates ROR together with Crossref and DataCite.
shortName: CDL
relationNotes:
  member-of@datacite: 'Member of DataCite that leads a consortium.'
body: |-
  The California Digital Library is a collaborative library hosted in the Office of the President of the University of California. It is one of three organisations that operate ROR under a shared Memorandum of Agreement.
