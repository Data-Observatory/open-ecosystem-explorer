summary: OSF is a platform for managing research projects and sharing preprints and
  data; the Center for Open Science runs it.
relationNotes:
  depends-on@datacite: OSF mints DOIs for projects, components and registrations through DataCite.
  depends-on@ror: OSF sends ROR identifiers for institutional affiliation together with
    ORCID iDs when minting DOI metadata.
body: |-
  OSF (Open Science Framework) supports the whole life cycle of a research project, from registration to data publication.
