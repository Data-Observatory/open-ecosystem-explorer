summary: Gold open access means the article is published in a journal in which all articles are openly
  available on the journal website.
localNote: In Latin America, SciELO and Redalyc act as publishers and repositories at once, so many of
  their articles fit these categories poorly.
body: In gold open access the article appears in an open access journal, one where every article is open
  on the journal's own website. In practice such journals are most often identified by their inclusion
  in the Directory of Open Access Journals (DOAJ). Diamond open access is the model with no charge to
  authors or readers.
