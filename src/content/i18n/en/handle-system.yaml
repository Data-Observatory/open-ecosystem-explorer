summary: The Handle System is a protocol that assigns persistent identifiers and resolves
  them to each object's current location; the DOI runs on top of it.
relationNotes:
  related-to@persistent-identifier: Resolution system that underpins the DOI and other persistent identifiers.
body: |-
  The Handle System resolves a persistent identifier to the current location of the object it represents. The DOI is the best-known naming scheme built on this protocol.
