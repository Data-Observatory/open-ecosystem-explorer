summary: Selective citation index descended from the 1964 Science Citation Index; an editorial team decides which journals are included.
relationNotes:
  owned-by@clarivate: Owned by Clarivate, a private company.
  depends-on@orcid: Web of Science Researcher Profiles sync publications and reviews in both directions with a connected ORCID iD.
body: |-
  Web of Science is a selective index: according to Clarivate, an in-house editorial team assesses journals against 28 criteria. It is owned by Clarivate.
