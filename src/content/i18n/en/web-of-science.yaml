summary: Selective citation index since the 1960s; an editorial board decides which
  journals are included. The impact factor comes from it.
relationNotes:
  owned-by@clarivate: Owned by Clarivate, a private company.
  depends-on@orcid: Web of Science Researcher Profiles sync publications and reviews
    in both directions with a connected ORCID iD.
body: |-
  Web of Science is the oldest and most selective index: an editorial board decides which journals are included. It is owned by Clarivate.
