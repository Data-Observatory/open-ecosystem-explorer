summary: Ibero-American regional information system on scientific journals, a cooperative network since 1997.
relationNotes:
  interoperates-with@redalyc: Joint Latindex-Redalyc-CLACSO-IBICT declaration on CC BY-NC-SA licensing for the region's open access journals.
body: |-
  Latindex is a cooperative network of national centres that has evaluated and made visible Ibero-American scientific journals since 1997.
