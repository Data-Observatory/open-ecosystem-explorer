summary: Jisc is a UK charity that runs Open Policy Finder, a service on the open
  access policies of publishers and funders.
relationNotes:
  member-of@coar: 'Listed on COAR''s members page.'
  member-of@coara: 'Listed among CoARA''s member organisations.'
body: |-
  Jisc consolidated several Sherpa services into Open Policy Finder, the current service for publisher and funder open access policies. It also historically ran OpenDOAR.
