summary: Community-led, open registry of persistent identifiers for research and funding organisations.
relationNotes:
  operated-by@datacite: One of three founding operating partners, along with Crossref and California Digital Library.
  operated-by@crossref: Founding operating partner; its accounting team manages ROR's finances.
  operated-by@california-digital-library: Founding operating partner.
body: |-
  ROR is an open registry: its data is published under CC0 and can be accessed through a search interface, a REST API and a data dump. It is operated by California Digital Library, Crossref and DataCite.
