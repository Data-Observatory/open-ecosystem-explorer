summary: Commercial repository that publishes content under open licences and
  mints DataCite DOIs for every record.
relationNotes:
  owned-by@digital-science: Acquired in 2012; roadmap and continuity are decided by the parent company.
body: |-
  Figshare publishes content under open licences and issues DOIs; its governance, roadmap and continuity are decided by a company. The distinction is the point.
