summary: International non-governmental council of social sciences, arts and humanities centres, created
  in 1967 and based in Buenos Aires.
body: CLACSO, the Latin American Council of Social Sciences, Arts and Humanities, is an international
  non-governmental institution with associative status in UNESCO, created in 1967. It brings together
  research and postgraduate centres in the social sciences and humanities in Latin America and other continents,
  and its Executive Secretariat is in Buenos Aires. It runs FOLEC, its forum on research assessment.
