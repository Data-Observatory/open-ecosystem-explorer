summary: Principles for Indigenous data that focus on collective benefit, authority to control, responsibility and ethics.
relationNotes:
  endorsed-by@rda: RDA formally affiliated with the Global Indigenous Data Alliance, which hosts CARE, and promotes the implementation of the Principles.
  related-to@indigenous-data-sovereignty: Principles for putting Indigenous data sovereignty into practice.
  related-to@open-data: Asks that opening data also respect collective benefit and control.
body: |-
  CARE was drafted by the Global Indigenous Data Alliance (GIDA) at a 2018 workshop co-organised with RDA in Gaborone, and GIDA still stewards it. CARE complements FAIR rather than replacing it: FAIR addresses findability and interoperability; CARE addresses who decides about data that involves Indigenous communities.
