summary: 'The CARE Principles for Indigenous Data Governance are principles, not a standard: collective benefit, authority to control, responsibility and ethics.'
relationNotes:
  related-to@indigenous-data-sovereignty: Principles for putting Indigenous data sovereignty into practice.
  related-to@open-data: Asks that opening data also respect collective benefit and control.
body: |-
  The CARE Principles for Indigenous Data Governance are principles for handling data about Indigenous peoples, not a technical standard or a certification. They were drafted at a workshop in Gaborone in 2018, held during International Data Week and an RDA Plenary, and released by the Global Indigenous Data Alliance (GIDA) in 2019. CARE complements FAIR rather than replacing it: FAIR addresses findability and interoperability; CARE addresses who decides about data that involves Indigenous communities.
