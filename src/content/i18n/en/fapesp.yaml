summary: Public research funding agency of the state of São Paulo; created SciELO in
  1997 and since 2024 co-funds it with CAPES and CNPq.
shortName: FAPESP
body: |-
  It funded SciELO almost alone for more than 26 years; since August 2024 it has supported it together with CAPES and CNPq through a national consortium.
