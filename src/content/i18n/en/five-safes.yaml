summary: 'The Five Safes is a framework for giving researchers safe access to confidential data: safe
  projects, people, settings, data and outputs.'
relationNotes:
  related-to@personal-data: Used to give researchers safe access to confidential data, including data
    about people.
body: 'The Five Safes framework is a set of principles that lets data services provide safe research access
  to data. It asks five questions: is the project appropriate (safe projects), are the researchers trained
  and authorised (safe people), is access in a controlled environment (safe settings), has the data been
  treated to protect confidentiality (safe data), and are the outputs checked so they do not disclose
  anyone (safe outputs). It originated at the UK Office for National Statistics and was developed by it
  and other data providers in the 2010s.'
