summary: Commercial institutional repository platform used by more than 500
  institutions and owned by Elsevier.
relationNotes:
  owned-by@elsevier: Acquired by Elsevier in 2017 through bepress. It is a wholly owned business unit.
  related-to@repository-software: Hosted commercial service that provides the repository software.
body: |-
  Digital Commons is built and run by bepress (Berkeley Electronic Press), which Elsevier acquired in 2017. It sits alongside Pure and Interfolio under the same parent.
