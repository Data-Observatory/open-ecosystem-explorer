summary: Nonprofit foundation that ran The Lens until June 2026, when it sold it.
body: |-
  Cambia ran The Lens, a service that, in the organisation's own words, serves global patent and scholarly knowledge as a public resource. On 1 June 2026 it announced the sale of The Lens business and assets to a non-profit in Australia that is now owned by SPIE (see The Lens).
