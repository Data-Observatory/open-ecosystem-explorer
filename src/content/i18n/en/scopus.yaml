summary: Abstract and citation database owned by Elsevier, with content selected by an independent advisory board (CSAB).
relationNotes:
  owned-by@elsevier: Owned by Elsevier (RELX group).
body: |-
  Scopus is a bibliographic and citation database owned by Elsevier. According to Elsevier, its content is curated by a Content Selection Advisory Board (CSAB), an international panel of independent experts.
