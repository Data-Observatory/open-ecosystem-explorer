summary: Community-curated index of assessed open access journals, operated by the DOAJ Foundation.
relationNotes:
  operated-by@doaj-foundation: Led and run by the DOAJ Foundation, a Danish non-profit foundation.
  operated-by@is4oa: Former operating organisation; operation passed to the DOAJ Foundation. According to doaj.org/about, IS4OA would continue to operate until mid-2026, when the transition would be complete; we have found no confirmation that it has closed.
  related-to@open-access: Directory of open access journals that meet its criteria.
body: |-
  DOAJ maintains a curated directory of open access journals that meet defined editorial and transparency criteria.
