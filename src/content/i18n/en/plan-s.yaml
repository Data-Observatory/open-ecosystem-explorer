summary: Funder requirement that research funded by participating agencies be published
  open access, immediately and without embargo, under an open licence.
relationNotes:
  governed-by@coalition-s: Plan S is the requirement that cOAlition S funders commit
    to implement.
body: |-
  Plan S is the requirement behind cOAlition S: publications from research funded by its members must appear in open access journals or platforms, or be available immediately in open access repositories without embargo. All publications must carry an open licence, preferably CC BY.
