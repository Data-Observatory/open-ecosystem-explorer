summary: Open, multilingual knowledge base; bibliographic coverage via WikiCite, fully downloadable, CC0.
body: |-
  The Wikimedia Foundation hosts Wikidata's infrastructure, and Wikimedia Deutschland leads its day-to-day development. In practice it acts as a crosswalk between identifiers in different databases. Its bibliographic coverage via WikiCite and its CC0 licence make it central for linking data across separate systems.
