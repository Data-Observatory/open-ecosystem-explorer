summary: An open-access mandate is a policy that requires researchers to deposit or
  publish their results openly, as a condition of their funding or employment.
localNote: 'In Chile, ANID approved an open-access policy in 2022 (Res. Ex. 3906/2022):
  ANID-funded output must be deposited openly within six months of publication.'
body: |-
  Mandates are issued by funders or institutions and usually specify what must be deposited or published, where, when, and sometimes under which licence. Plan S is one prominent funder example.
