summary: OpenAIRE is a European infrastructure that gathers content from many repositories
  and links it to its funders, to make it easier to find.
relationNotes:
  indexes@zenodo: OpenAIRE and Zenodo have worked closely together since Zenodo launched
    in 2013; OpenAIRE aggregates and links its records.
  related-to@research-repository: 'Gathers content from institutional and other repositories and links it to funding data.'
body: |-
  OpenAIRE aggregates content from institutional repositories in Europe and connects it with funding data.
