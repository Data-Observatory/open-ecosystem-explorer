summary: Espacio Ciencia is Chile's national portal that brings together content from
  institutional repositories and the ANID repository; ANID runs it.
relationNotes:
  part-of@la-referencia: Chile's national node within the federated LA Referencia network.
  related-to@research-repository: Harvests institutional repositories into a single national discovery point.
body: |-
  Espacio Ciencia harvests Chile's institutional repositories and the Repositorio ANID into a single discovery point.
