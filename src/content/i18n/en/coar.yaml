summary: COAR is a global confederation of open access repositories that promotes
  good practice and common standards among them.
relationNotes:
  member-of@rda: 'Listed as an affiliate member of RDA.'
  member-of@coara: 'Listed among CoARA''s member organisations.'
  related-to@research-repository: 'COAR brings repositories and repository networks together to build capacity and align policies.'
body: |-
  COAR brings repositories and their networks together worldwide to coordinate good practice and common standards, including the development of COAR Notify.
