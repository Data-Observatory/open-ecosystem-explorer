summary: Danish nonprofit foundation, governed by its community, that runs and manages DOAJ since the handover from IS4OA.
body: |-
  The DOAJ Foundation, with its registered office in Roskilde (Denmark), is the legal entity that manages DOAJ. Its Foundation Board and Advisory Board bring together librarians, publishers, researchers and funders. It replaces IS4OA, which ran DOAJ; according to doaj.org/about, IS4OA would continue to operate until mid-2026, when the transition would be complete. We have found no confirmation that it has finished.
