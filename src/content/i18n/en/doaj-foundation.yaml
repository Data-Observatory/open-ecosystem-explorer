summary: Danish nonprofit foundation, governed by its community, that runs and manages DOAJ since the handover from IS4OA.
body: |-
  The DOAJ Foundation, with its registered office in Roskilde (Denmark), is the legal entity that manages DOAJ. Its Foundation Board and Advisory Board bring together librarians, publishers, researchers and funders. It replaces IS4OA, which ran DOAJ until the transition, completed in mid-2026.
