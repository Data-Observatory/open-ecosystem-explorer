summary: Diamond open access is a publishing model that charges neither readers nor
  authors, and is funded by institutions, consortia or public money.
localNote: In Latin America it is the most widespread model, supported by public non-profit
  platforms such as SciELO, Redalyc and AmeliCA.
body: |-
  Diamond open access is a subtype of open access in which costs are covered by institutions, consortia or public funds instead of article processing charges or subscriptions. Journals, platforms and consortia operate it; it is a model, not a technology.
