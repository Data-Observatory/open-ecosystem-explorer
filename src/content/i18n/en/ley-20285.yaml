summary: 'Chilean transparency law of 2008: acts of the State and information made with public money are
  public unless the law says otherwise.'
shortName: Law 20.285
relationNotes:
  governed-by@consejo-para-la-transparencia: Its Consejo para la Transparencia oversees compliance and
    decides complaints about denied access (arts. 31-33).
body: Law 20.285 was published on 20 August 2008. Article 5 makes public the acts and resolutions of State
  bodies, their grounds and supporting documents, and also the information produced with public budget
  or held by those bodies, in any format, unless a legal exception applies. The law created the Consejo
  para la Transparencia (article 31) to promote transparency, oversee compliance and guarantee the right
  of access to information. It is about public information held by the State; it does not by itself set
  a licence or a data format, which is what separates it from open data.
