summary: Policy of the Chilean agency ANID requiring the articles and data it funds
  to be published openly, with a data management plan.
shortName: ANID policy
relationNotes:
  governed-by@anid: Approved by ANID through Resolución Exenta 3906/2022 of 2 May
    2022.
  mandates@oai-pmh: Repositories used for ANID-funded data must interoperate with
    the ANID repository via OAI-PMH.
  related-to@research-data-management: 'Requires grantees to submit a data management plan whose purpose is to make the data publicly available.'
  related-to@data-management-plan: 'Requires grantees to submit a data management plan to guarantee public availability of the data.'
  related-to@research-repository: 'Funded articles go to the agency''s repository; data to the agency''s, an institutional or a disciplinary repository.'
  related-to@open-access: 'The policy''s subject: open access to publicly funded scientific information and research data.'
  mandates@doi: Authors must give ANID the DOI of each published article so it can be identified and retrieved.
  related-to@fair: For research data the policy is based on the FAIR principles.
body: |-
  Approved by ANID in 2022, it requires beneficiaries to deposit the final version of their funded publications in the ANID repository within six months of publication, to submit a data management plan, and to publish research data openly.
