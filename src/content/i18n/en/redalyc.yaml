summary: Redalyc is a platform run by a Mexican university that publishes Latin American
  journals in open access, without charging authors.
relationNotes:
  member-of@amelica: AmeliCA is built around Redalyc and UNESCO.
  related-to@diamond-open-access: Runs journals under the diamond model.
body: |-
  Redalyc, together with SciELO, has decades of experience making the region's journals visible, with an open access model that charges authors nothing.
