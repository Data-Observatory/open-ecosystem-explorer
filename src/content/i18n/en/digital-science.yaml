summary: Digital Science is a research technology company that owns Figshare, Dimensions
  and Symplectic Elements, among other tools.
relationNotes:
  owned-by@holtzbrinck: Wholly owned. Holtzbrinck also holds a majority (50.6%) of Springer Nature.
body: |-
  Digital Science is owned by Holtzbrinck. It runs, among other things, a bibliographic index, a commercial CRIS and a repository platform.
