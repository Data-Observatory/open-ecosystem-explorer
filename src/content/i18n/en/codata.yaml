summary: Committee of the International Science Council focused on data,
  interoperability, policy and capacity. Chile has a national committee driven by
  Data Observatory.
relationNotes:
  member-of@rda: CODATA is a documented Affiliate Member of RDA. The two bodies operate
    under a memorandum of understanding with complementary roles.
body: |-
  CODATA works on data interoperability across domains, and is the community behind CDIF.
