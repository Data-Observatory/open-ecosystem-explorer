summary: Committee of the International Science Council focused on data, interoperability, policy and capacity.
relationNotes:
  member-of@rda: CODATA is a documented Affiliate Member of RDA. The two bodies operate under a memorandum of understanding with complementary roles.
localNote: Chile joined CODATA in 2025; Data Observatory is its member organisation and is setting up the national committee.
body: |-
  CODATA works on data interoperability across domains, and is the community behind CDIF.
