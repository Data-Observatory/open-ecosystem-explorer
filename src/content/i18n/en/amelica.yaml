summary: Non-commercial open access initiative for Latin America, linked to Redalyc, UNESCO and CLACSO.
relationNotes:
  related-to@diamond-open-access: Promotes a non-commercial, diamond-type model of communication.
body: |-
  AmeliCA promotes a non-commercial model of scientific communication. Its website presents Redalyc, UNESCO and CLACSO as linked institutions, and UNESCO has supported joint work by AmeliCA and Redalyc UAEM, such as a non-commercial open access strategy in Angola.
