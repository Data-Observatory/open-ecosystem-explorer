summary: ReSA is a fiscally sponsored project working so that research software and the people who build it are recognised and valued in research.
relationNotes:
  related-to@research-software: Its whole remit is recognising and supporting research software.
body: |-
  ReSA is led by a Steering Committee and fiscally sponsored by Code for Science & Society. It aims to coordinate existing research software efforts and was one of the three conveners of the FAIR4RS working group.
