summary: Certification seal for trustworthy repositories, within reach of a well-run repository.
relationNotes:
  profile-of@trust-principles: CoreTrustSeal turns the TRUST principles into certifiable requirements.
body: |-
  CoreTrustSeal is the fastest way for a third party to check that a repository is serious, without building a certification from scratch. Its requirements are maintained by the CoreTrustSeal Foundation, an independent Dutch foundation (Stichting) since 2018, with an elected board of 12 members.
