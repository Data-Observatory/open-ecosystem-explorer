summary: CoreTrustSeal is a certification showing that a repository meets requirements
  for storing and preserving data reliably.
relationNotes:
  related-to@trust-principles: The TRUST paper cites CoreTrustSeal as an example of how repositories attain the TRUST properties.
body: |-
  CoreTrustSeal lets a third party check that a repository is reliable, without building a certification from scratch. Its requirements are maintained by the CoreTrustSeal Foundation, an independent Dutch foundation (Stichting) since 2018, with an elected board of 12 members.
