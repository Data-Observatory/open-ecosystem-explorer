summary: US university that hosted and ran arXiv for 25 years, until its independence on 1 July 2026.
relationNotes:
  member-of@datacite: 'Direct member of DataCite.'
body: |-
  Cornell University, through its university library and, since 2019, under administrative oversight from Cornell Tech, ran arXiv until it became an independent organisation. It remains a founding member of arXiv, Inc. alongside the Simons Foundation.
