summary: Una política de ciencia abierta es un marco formal que fija reglas y apoyos
  para compartir publicaciones y datos, adoptado por un Estado o institución.
name: Política de ciencia abierta
localNote: No encontramos una política nacional de ciencia abierta independiente en
  Chile; el instrumento vigente es la política de acceso abierto de ANID, y varias
  universidades tienen la suya.
body: |-
  La Recomendación de la UNESCO sobre Ciencia Abierta (2021) es el instrumento de referencia global. Las políticas pueden adoptarse a nivel nacional, de financiador o institucional.
