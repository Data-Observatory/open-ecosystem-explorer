summary: OpenCitations es una infraestructura sin fines de lucro que publica datos
  de citas entre publicaciones, abiertos y descargables por cualquiera.
relationNotes:
  member-of@barcelona-declaration: Figura entre los supporters de la Declaración (no entre los firmantes).
  depends-on@doi: Los registros de citas se identifican mediante los DOI de los
    artículos citante y citado.
body: |-
  OpenCitations publica datos de citas académicas como datos abiertos y enlazados, permitiendo su descarga y reutilización sin restricciones.
