summary: Ley chilena de 2024 que reforma la Ley 19.628 sobre datos personales y crea la Agencia de Protección
  de Datos Personales.
shortName: Law 21.719
relationNotes:
  related-to@personal-data: Define dato personal como información sobre una persona natural identificada
    o identificable.
  related-to@anonymisation: La anonimización es irreversible y el dato anonimizado deja de ser un dato
    personal.
  related-to@pseudonymisation: Define la seudonimización y la incluye entre las medidas de seguridad de
    los datos personales.
  related-to@research-data-management: El derecho de oposición no rige para tratamientos con fines de
    investigación científica que requiera una función o un interés público.
body: La Ley 21.719 se publicó el 13 de diciembre de 2024. Reforma la Ley 19.628, que pasa a ser la ley
  sobre protección de los datos personales, y crea la Agencia de Protección de Datos Personales. Define
  dato personal, anonimización y seudonimización, y establece los derechos de las personas a quienes se
  refieren los datos. Para la investigación, dispone que el dato anonimizado deja de ser dato personal
  y que el derecho de oposición no rige para tratamientos con fines de investigación científica que requiera
  una función pública o una actividad de interés público. Un artículo transitorio fija cuándo entra en
  vigor la reforma; la fecha vigente se consulta en LeyChile.
