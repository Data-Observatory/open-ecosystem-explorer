summary: Organización intergubernamental que coordina los Centros Nacionales de ISSN.
relationNotes:
  issues@issn: Coordina la red de Centros Nacionales de ISSN que asignan el
    identificador a publicaciones seriadas.
body: |-
  El Centro Internacional del ISSN (CIEPS), con sede en París, opera la red intergubernamental de Centros Nacionales de ISSN.
