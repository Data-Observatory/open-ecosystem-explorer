summary: Red federada de once países latinoamericanos más España, que agrega artículos y tesis (no datos de investigación).
relationNotes:
  interoperates-with@openaire: Cosecha desde nodos nacionales bajo las directrices de OpenAIRE desde 2016.
  indexes@scielo: LA Referencia indexa las colecciones nacionales de SciELO.
localNote: En Chile, ANID es una de las instituciones afiliadas a LA Referencia.
body: |-
  LA Referencia reúne más de cinco millones de registros de metadatos. Se financia sobre todo con aportes anuales de los países miembros e interopera con OpenAIRE.
