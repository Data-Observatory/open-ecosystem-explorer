summary: El acceso abierto bronce es el de un artículo gratuito en el sitio de la editorial, sin licencia
  abierta que permita reutilizarlo.
body: Los artículos bronce son gratuitos para leer en el sitio de la editorial, pero no tienen una licencia
  abierta explícita. No se publican en revistas contadas como de acceso abierto en el DOAJ y, a diferencia
  de los híbridos, no muestran información de licencia. Sin licencia permiten leer, pero no queda claro
  ningún otro uso, y el estudio señala que no está claro si siguen gratuitos de forma temporal o permanente.
  El término se propuso en un estudio de 2018 sobre cuánta literatura es abierta.
