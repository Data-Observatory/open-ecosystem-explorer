summary: Base de conocimiento abierta y multilingüe; cobertura bibliográfica vía
  WikiCite, descargable completa, CC0.
body: |-
  Wikidata la aloja la Wikimedia Foundation (infraestructura) y su desarrollo diario lo lidera Wikimedia Deutschland. Funciona de facto como un cruce de identificadores entre bases: su cobertura bibliográfica vía WikiCite y su licencia CC0 la hacen central para enlazar datos entre sistemas distintos.
