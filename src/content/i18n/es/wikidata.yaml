summary: Base de conocimiento abierta y multilingüe; cobertura bibliográfica vía WikiCite, descargable completa, CC0.
body: |-
  Wikidata la aloja la Wikimedia Foundation (infraestructura) y su desarrollo diario lo lidera Wikimedia Deutschland. Sus datos estructurados se publican bajo CC0, y su cobertura bibliográfica llega a través de WikiCite.
