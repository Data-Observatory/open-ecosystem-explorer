summary: Plataforma de UAEM que marca y publica revistas latinoamericanas de
  acceso abierto sin cargo al autor.
relationNotes:
  member-of@amelica: AmeliCA está construida en torno a Redalyc y UNESCO.
  related-to@diamond-open-access: Opera revistas bajo el modelo diamante.
body: |-
  Redalyc, junto con SciELO, tiene décadas de trayectoria en visibilidad de revistas de la región, con un modelo de acceso abierto sin cargo al autor.
