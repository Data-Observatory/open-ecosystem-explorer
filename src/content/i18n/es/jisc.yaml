summary: Jisc es una organización benéfica británica que opera Open Policy Finder,
  un servicio sobre políticas de acceso abierto de editoriales y financiadores.
body: |-
  Jisc consolidó varios servicios Sherpa en Open Policy Finder, el servicio actual de políticas de acceso abierto de editoriales y financiadores. Históricamente operó también OpenDOAR.
