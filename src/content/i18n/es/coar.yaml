summary: COAR es una confederación mundial de repositorios de acceso abierto que promueve
  buenas prácticas y estándares comunes entre ellos.
relationNotes:
  member-of@rda: 'Figura como miembro afiliado de RDA.'
  member-of@coara: 'Figura entre las organizaciones miembro de CoARA.'
  related-to@research-repository: 'COAR reúne repositorios y redes de repositorios para fortalecer capacidades y alinear políticas.'
body: |-
  COAR agrupa repositorios y sus redes a nivel global para coordinar buenas prácticas y estándares comunes, incluido el desarrollo de COAR Notify.
