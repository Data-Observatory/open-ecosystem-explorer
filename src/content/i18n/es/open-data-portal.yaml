summary: Un portal de datos abiertos es una plataforma en línea donde se consultan colecciones de datos abiertos, a menudo las de quien lo opera.
name: Portal de datos abiertos
body: |-
  Los gobiernos suelen mantener portales para cumplir requisitos de acceso a la información, y los investigadores los usan para compartir datos con otros. Un buen portal usa estándares abiertos y da acceso a los datos sin intervención humana.
localNote: En Chile, el portal nacional del Estado es datos.gob.cl.
