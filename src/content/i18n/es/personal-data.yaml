summary: Dato personal es toda información sobre una persona natural identificada o identificable; en
  Chile, la Ley 21.719 da la definición legal.
relationNotes:
  related-to@pseudonymisation: Dato personal que ya no puede atribuirse a una persona sin información
    adicional guardada por separado.
body: Dato personal es la información vinculada o referida a una persona natural identificada o que puede
  identificarse, directa o indirectamente, por ejemplo mediante un nombre o un número de identidad. Que
  un conjunto de datos de investigación contenga datos personales decide qué reglas se aplican para compartirlo.
  La Ley 21.719 de Chile da la definición legal que se usa aquí.
