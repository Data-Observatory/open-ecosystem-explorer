summary: ReSA es un proyecto con patrocinio fiscal que busca que el software de investigación y quienes lo desarrollan reciban reconocimiento y valoración en la investigación.
relationNotes:
  related-to@research-software: Todo su ámbito es el reconocimiento y apoyo del software de investigación.
body: |-
  ReSA la dirige un comité directivo y la patrocina fiscalmente Code for Science & Society. Busca coordinar los esfuerzos existentes en torno al software de investigación y fue una de las tres entidades convocantes del grupo FAIR4RS.
