summary: El software de código abierto se publica con una licencia que permite a cualquiera usarlo, estudiarlo, modificarlo y distribuirlo para cualquier fin.
name: Software de código abierto
body: |-
  Se define casi siempre mediante la Definición de código abierto, que publica la Open Source Initiative y que mantiene una lista de licencias conformes. Se solapa mucho con el software libre, del que se distingue sobre todo por el énfasis.
