summary: Un CRIS es un sistema de información que enlaza proyectos, personas, instituciones
  y productos de investigación para que instituciones y financiadores los gestionen
  y reporten.
name: Sistema de información de investigación (CRIS)
aka:
  - Sistema de información de investigación
  - RIS
body: |-
  Sus entidades centrales son personas, organizaciones, proyectos y resultados, y el modelo de datos CERIF de euroCRIS es la referencia común. Un CRIS gestiona sobre todo registros de la actividad de investigación, no almacena los resultados en sí.
