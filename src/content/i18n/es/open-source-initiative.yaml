summary: La Open Source Initiative, organización sin fines de lucro de EE. UU. fundada en 1998, mantiene la Definición de código abierto y aprueba licencias.
relationNotes:
  related-to@open-source-software: Mantiene la definición y la lista de licencias aprobadas del código abierto.
  related-to@open-license: Aprueba licencias que cumplen la Definición de código abierto.
body: |-
  Es una corporación de beneficio público de California con estatus 501(c)(3). Educa y promueve el código abierto y gestiona el programa de licencias aprobadas por la OSI.
