summary: La revisión por pares es un proceso en que especialistas independientes evalúan
  un trabajo científico antes de publicarlo, para ayudar a decidir si es sólido.
name: Revisión por pares
body: |-
  La revisión por pares es el término de contraste de los preprints: la evaluación por especialistas ocurre antes, y no después, de la publicación formal. Los modelos de revisión varían, desde anónimos hasta informes abiertos.
