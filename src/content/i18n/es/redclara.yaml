summary: RedCLARA es una organización sin fines de lucro que opera la red avanzada que conecta
  a universidades y centros de investigación de América Latina.
body: |-
  Incluye a LA Referencia entre sus proyectos de colaboración. Los acuerdos técnico-organizativos concretos entre ambos no están documentados en las fuentes citadas aquí (sin verificar).
