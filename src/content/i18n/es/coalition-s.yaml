summary: Coalición de financiadores de investigación, lanzada en 2018, detrás del Plan S y su exigencia de acceso abierto inmediato.
body: |-
  cOAlition S es un consorcio internacional de organismos que financian y ejecutan investigación y respalda el Plan S: con efecto desde 2021, sus principios piden que las publicaciones de investigación financiada aparezcan en revistas o plataformas de acceso abierto, o estén disponibles de inmediato en repositorios abiertos sin embargo.
