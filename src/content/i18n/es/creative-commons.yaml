summary: Creative Commons es una organización sin fines de lucro de EE. UU. que publica las licencias Creative Commons y la herramienta de dominio público CC0.
relationNotes:
  related-to@open-license: Mantiene la familia de licencias Creative Commons, la más conocida de las licencias abiertas.
body: |-
  Creative Commons se fundó en 2001 y se define como la organización sin fines de lucro detrás de las licencias abiertas más usadas del mundo. Sus licencias dan de antemano el permiso de reutilización, y CC0 es una dedicación al dominio público.
