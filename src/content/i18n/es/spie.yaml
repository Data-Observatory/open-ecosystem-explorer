summary: Sociedad internacional sin fines de lucro de óptica y fotónica, con sede en Bellingham, Washington, EE. UU.
body: |-
  SPIE se describe a sí misma como una sociedad sin fines de lucro que sirve a investigadores, docentes e industria de la ciencia y la tecnología basadas en la luz. Tiene su sede en Bellingham, Washington, EE. UU.

  Aparece aquí porque The Lens, el índice de patentes y literatura académica, es una filial de propiedad total de SPIE desde su venta por Cambia en junio de 2026 (véase The Lens).
