summary: Semantic Scholar es un buscador del Allen Institute for AI que analiza el
  texto de los artículos para relacionarlos, no solo por citas.
relationNotes:
  operated-by@allen-institute-for-ai: Desarrollado y operado por el Allen Institute for AI.
body: |-
  Semantic Scholar aplica procesamiento de lenguaje natural para conectar publicaciones semánticamente, no solo por citas explícitas.
