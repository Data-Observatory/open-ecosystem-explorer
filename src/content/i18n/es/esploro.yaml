summary: Esploro es un sistema comercial de información de investigación (CRIS) creado
  por Ex Libris y hoy propiedad de Clarivate.
body: |-
  Esploro llegó a Clarivate junto con la adquisición de ProQuest en 2021, sumando un tercer producto (junto a Web of Science y Converis) bajo la misma matriz.
