summary: Servidor de preprints de física, matemáticas y ciencias de la
  computación, operado por Cornell University.
relationNotes:
  funded-by@cornell: Uno de varios financiadores, junto a la Simons Foundation y
    un consorcio de instituciones miembro.
  implements@oai-pmh: arXiv es uno de los primeros implementadores de OAI-PMH; el
    protocolo surgió en parte de necesidades de cosecha como las de arXiv.
body: |-
  arXiv es el servidor de preprints más antiguo y usado del mundo, operado por Cornell University.
