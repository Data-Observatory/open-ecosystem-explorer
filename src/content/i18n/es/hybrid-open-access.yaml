summary: El acceso abierto híbrido abre de inmediato un artículo de una revista de suscripción, con licencia
  abierta y a cambio de un pago.
body: En el acceso abierto híbrido un artículo se publica en una revista de suscripción pero queda de
  inmediato gratuito para leer, con licencia abierta, a cambio de un cargo por procesamiento de artículos
  (APC) que pagan los autores o su institución. La revista sigue vendiendo suscripciones, por lo que una
  institución puede pagar dos veces por la misma revista.
