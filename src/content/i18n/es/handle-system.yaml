summary: El Handle System es un protocolo que asigna identificadores persistentes
  y los resuelve a la ubicación actual de cada objeto; sobre él funciona el DOI.
relationNotes:
  related-to@persistent-identifier: Sistema de resolución que sustenta al DOI y a otros
    identificadores persistentes.
body: |-
  El Handle System resuelve un identificador persistente a la ubicación actual del objeto que representa. El DOI es el esquema de nombres más conocido construido sobre este protocolo.
