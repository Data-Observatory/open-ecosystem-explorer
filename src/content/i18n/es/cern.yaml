summary: CERN es una organización europea de investigación que opera el repositorio
  Zenodo junto con OpenAIRE y lidera el software de repositorios InvenioRDM.
relationNotes:
  member-of@w3c: 'Figura entre los miembros actuales de W3C.'
  member-of@coara: 'Figura entre las organizaciones miembro de CoARA.'
  member-of@datacite: 'Miembro directo de DataCite.'
body: |-
  CERN es el operador y desarrollador detrás de dos piezas centrales de la capa de repositorios: Zenodo, el repositorio general con DOI incluido, e InvenioRDM, el software que lo sostiene.
