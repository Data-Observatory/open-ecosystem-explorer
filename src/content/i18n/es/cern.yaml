summary: Organización intergubernamental europea que opera Zenodo junto a
  OpenAIRE y lidera el desarrollo de InvenioRDM.
body: |-
  CERN es el operador y desarrollador detrás de dos piezas centrales de la capa de repositorios: Zenodo, el repositorio general con DOI incluido, e InvenioRDM, el software que lo sostiene.
