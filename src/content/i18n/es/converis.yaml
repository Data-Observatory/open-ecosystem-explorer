summary: Converis es un sistema comercial de información de investigación (CRIS) de
  Clarivate con el que las instituciones gestionan su actividad científica.
body: |-
  Converis es el CRIS de Clarivate. No se encontró anuncio de discontinuación del producto; los comentarios sobre una eventual fusión con Esploro son especulación de mercado, no un anuncio oficial.
