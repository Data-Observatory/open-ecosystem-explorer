summary: FAIRsharing es un registro curado de estándares, bases de datos y políticas
  de datos que muestra cómo se relacionan, para ayudar a aplicar FAIR.
relationNotes:
  complies-with@fair: Construido explícitamente para ayudar a alinear recursos con
    los principios FAIR.
  interoperates-with@re3data: Ambos curan registros de repositorios/estándares y cruzan sus entradas.
body: |-
  FAIRsharing cataloga estándares, bases de datos y políticas de datos, mostrando cómo se relacionan entre sí, con foco explícito en apoyar la adopción de FAIR.
