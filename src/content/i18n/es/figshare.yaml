summary: Repositorio comercial que publica contenido bajo licencias abiertas y
  acuña DOI de DataCite para cada registro.
relationNotes:
  owned-by@digital-science: Adquirida en 2012; la hoja de ruta y continuidad las
    decide la empresa propietaria.
body: |-
  Figshare publica contenido bajo licencias abiertas y acuña DOI, pero su gobernanza, hoja de ruta y continuidad las decide una empresa. Esa distinción es el punto central.
