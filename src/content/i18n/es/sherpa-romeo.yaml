summary: Servicio histórico de políticas editoriales de acceso abierto,
  fusionado en Open Policy Finder el 4 de noviembre de 2024.
relationNotes:
  operated-by@jisc: Operado por Jisc hasta su fusión en Open Policy Finder.
body: |-
  Sherpa Romeo listaba las políticas de auto-archivo de las editoriales. El servicio fue reemplazado por Open Policy Finder, que fusionó Romeo, Juliet y Fact en una sola herramienta.
