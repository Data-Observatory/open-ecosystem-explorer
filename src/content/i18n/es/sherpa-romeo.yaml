summary: Sherpa Romeo fue un servicio que indicaba qué podían depositar los autores
  según la política de cada editorial; hoy forma parte de Open Policy Finder.
relationNotes:
  operated-by@jisc: Operado por Jisc hasta su fusión en Open Policy Finder.
body: |-
  Sherpa Romeo listaba las políticas de autoarchivo de las editoriales, es decir, qué pueden depositar los autores y cuándo. El servicio fue reemplazado el 4 de noviembre de 2024 por Open Policy Finder, que fusionó Romeo, Juliet y Fact en una sola herramienta.
