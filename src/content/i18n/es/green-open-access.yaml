summary: El acceso abierto verde es el de un artículo publicado en una revista de suscripción que además
  se deposita en un repositorio abierto.
relationNotes:
  related-to@preprint: La copia archivada puede ser la versión publicada o un preprint.
  related-to@institutional-repository: Los artículos verdes se autoarchivan en un repositorio disciplinar
    o institucional.
body: En el acceso abierto verde un artículo se publica en una revista que no es abierta y además se autoarchiva
  en un repositorio abierto, sea disciplinar, como arXiv, o institucional, a cargo de una universidad.
  La copia archivada puede ser la versión publicada o un preprint. La mayoría de las copias verdes no
  cumple la definición de Budapest de acceso abierto, porque no extiende derechos de reutilización.
