summary: Editorial comercial propietaria de Scopus, Pure, Interfolio y Digital
  Commons (bepress) — un índice, un CRIS y dos plataformas de repositorio en el
  mismo portafolio.
relationNotes:
  owned-by@relx: Elsevier es una división de RELX.
body: |-
  Elsevier es el ejemplo más citado de integración vertical: posee el índice (Scopus), el CRIS (Pure) y plataformas de repositorio (Interfolio, Digital Commons) que muchas instituciones usan para registrar y evaluar su propia investigación.
