summary: Ministerio chileno de ciencia, tecnología, conocimiento e innovación, creado en 2018; ANID se
  relaciona con la Presidencia a través de él.
shortName: MinCiencia
body: El Ministerio de Ciencia, Tecnología, Conocimiento e Innovación fue creado por la Ley 21.105 de
  2018. ANID, la agencia que ejecuta los programas de financiamiento de la investigación, se relaciona
  con la Presidencia de la República a través de él. Según la Ley 21.838, el Ministerio, junto con el
  de Economía, dicta el reglamento que fija los términos de uso del repositorio nacional.
