summary: RDA es una comunidad que reúne a personas en grupos de trabajo y de interés
  para producir recomendaciones sobre datos de investigación.
relationNotes:
  related-to@care: Su Grupo de Interés en Soberanía de Datos Indígenas produjo los principios CARE.
  related-to@trust-principles: Publicados en Scientific Data (2020) como esfuerzo comunitario de RDA.
  member-of@coara: 'Figura entre las organizaciones miembro de CoARA.'
body: |-
  Las recomendaciones de RDA las producen sus grupos de trabajo y de interés.
