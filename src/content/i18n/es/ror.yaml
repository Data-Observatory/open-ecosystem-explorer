summary: Identifica instituciones de investigación; probablemente el
  identificador con mejor relación costo-beneficio para instituciones
  latinoamericanas.
relationNotes:
  operated-by@datacite: Uno de los tres socios operadores fundadores, junto con
    Crossref y California Digital Library.
  operated-by@crossref: Socio operador fundador; su equipo de contabilidad
    administra las finanzas de ROR.
  operated-by@california-digital-library: Socio operador fundador.
body: |-
  ROR es gratuito y abierto, y es la única forma de que el trabajo de una institución chilena se agregue correctamente en las bases mundiales en vez de quedar disperso bajo nombres distintos.
