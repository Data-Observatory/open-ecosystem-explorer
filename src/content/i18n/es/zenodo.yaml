summary: Repositorio general gratuito operado por el CERN, con DOI incluido.
relationNotes:
  operated-by@cern: Operado por el CERN desde su lanzamiento en 2013, que nació del proyecto OpenAIRE encargado por la Comisión Europea, del que el CERN es socio; sigue en estrecha colaboración con esa red (ver la relación entrante "indexa" desde OpenAIRE).
  related-to@open-license: Pide a quien deposita elegir una licencia para los registros en acceso abierto.
body: |-
  Zenodo es uno de los repositorios de referencia del ecosistema: gratuito, con DOI incluido.
