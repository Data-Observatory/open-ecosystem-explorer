summary: Modelo de intercambio de información de investigación de euroCRIS,
  recomendado por la UE a sus estados miembro.
body: |-
  CERIF es el estándar de interoperabilidad detrás de los CRIS comerciales y nacionales. La versión clásica ya no se desarrolla activamente y CERIF 2.0 aún no está aprobado.
