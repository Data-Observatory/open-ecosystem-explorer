summary: Modelo de intercambio de información de investigación de euroCRIS, recomendado por la UE a sus estados miembro.
relationNotes:
  developed-by@eurocris: 'CERIF es mantenido y desarrollado por un grupo de trabajo de euroCRIS.'
body: |-
  CERIF es un modelo de intercambio de información de investigación usado en sistemas de información de investigación (CRIS). euroCRIS prepara una refactorización, CERIF-Core, que aún no ha sido aprobada como estándar oficial.
