summary: Un preprint es un manuscrito que sus autores publican en un servidor abierto
  antes de la revisión por pares, para compartir resultados más rápido.
name: Preprint (prepublicación)
aka:
  - Prepublicación
body: |-
  Un preprint normalmente aún no ha sido revisado por pares y puede aparecer después en una revista en versión revisada. Los servidores de preprints permiten compartir resultados pronto y establecer la prioridad.
