summary: El Data Spectrum del Open Data Institute muestra los datos en una escala de cerrado a compartido
  y a abierto, y no como una elección de sí o no.
relationNotes:
  related-to@open-data: Sitúa los datos abiertos en un extremo de una escala que va de cerrado a compartido
    y a abierto.
body: El Data Spectrum del Open Data Institute es una herramienta para entender el lenguaje de los datos,
  desde los datos cerrados hasta los compartidos y los abiertos. El acceso se entiende como una escala,
  no como una elección de sí o no. Los gráficos se publican con licencia CC BY; ellos, y no el texto de
  la página, dan los pasos exactos de la escala.
