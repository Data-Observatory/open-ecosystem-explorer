summary: Comunidad técnica que gobierna el esquema de identificadores ARK, su
  registro de NAAN y el resolutor N2T.
relationNotes:
  funded-by@lyrasis: Cuerpo autogobernado por la comunidad, apoyado en parte por
    LYRASIS tras la transición de gobernanza desde California Digital Library.
body: |-
  La ARK Alliance coordina a las instituciones que emiten identificadores ARK y mantiene la infraestructura de resolución compartida.
