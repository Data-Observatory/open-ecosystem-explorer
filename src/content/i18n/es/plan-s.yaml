summary: Plan S es un requisito de agencias financiadoras que exige publicar en acceso
  abierto, de inmediato y con licencia abierta, la investigación que financian.
relationNotes:
  governed-by@coalition-s: Plan S es el requisito que los financiadores de cOAlition
    S se comprometen a aplicar.
body: |-
  Plan S es el requisito que respalda cOAlition S: las publicaciones de la investigación financiada por sus miembros deben aparecer en revistas o plataformas de acceso abierto, o estar disponibles de inmediato en repositorios de acceso abierto sin embargo. Todas deben llevar una licencia abierta, de preferencia CC BY.
