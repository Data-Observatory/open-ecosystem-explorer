summary: El competidor más grande y menos selectivo que Web of Science;
  propiedad de Elsevier.
relationNotes:
  owned-by@elsevier: Propiedad de Elsevier (grupo RELX).
body: |-
  Scopus es el índice bibliográfico más grande, con criterios de inclusión menos estrictos que Web of Science. Es propiedad de Elsevier.
