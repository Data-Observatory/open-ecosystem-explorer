summary: Base de datos de resúmenes y citas de Elsevier, cuyo contenido selecciona un comité asesor independiente (CSAB).
relationNotes:
  owned-by@elsevier: Propiedad de Elsevier (grupo RELX).
body: |-
  Scopus es una base de datos bibliográfica y de citas de Elsevier. Según Elsevier, su contenido lo cura un Content Selection Advisory Board (CSAB), un panel internacional de expertos independientes.
