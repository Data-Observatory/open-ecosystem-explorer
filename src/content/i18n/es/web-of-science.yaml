summary: Índice bibliográfico selectivo heredero del Science Citation Index de 1964; un equipo editorial decide qué revistas se incluyen.
relationNotes:
  owned-by@clarivate: Propiedad de Clarivate, empresa privada.
  depends-on@orcid: Los Perfiles de Investigador de Web of Science sincronizan bidireccionalmente publicaciones y revisiones con un iD de ORCID conectado.
body: |-
  Web of Science es un índice selectivo: según Clarivate, un equipo editorial interno evalúa las revistas con 28 criterios. Es propiedad de Clarivate.
