summary: Índice bibliográfico selectivo desde los años sesenta; un comité decide
  qué revistas entran. De ahí sale el factor de impacto.
relationNotes:
  owned-by@clarivate: Propiedad de Clarivate, empresa privada.
  depends-on@orcid: Los Perfiles de Investigador de Web of Science sincronizan
    bidireccionalmente publicaciones y revisiones con un iD de ORCID conectado.
body: |-
  Web of Science es el índice más antiguo y selectivo: un comité editorial decide qué revistas se incluyen. Es propiedad de Clarivate.
