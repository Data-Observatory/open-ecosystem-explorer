title: Sesgo de cobertura
question: ¿Qué índices bibliográficos y de citas cubren qué idiomas, qué tipos
  de objeto, y con qué criterios de inclusión?
body: |-
  Libros, literatura gris y revistas fuera del inglés quedan subrepresentados en los índices bibliográficos y de citas. Como las decisiones de contratación y financiamiento se toman mirando ese mapa, el sesgo se vuelve profecía autocumplida. Esta vista compara los índices del grafo por sus idiomas y tipos de objeto cubiertos, si permiten descarga masiva, y qué tan abiertos son sus criterios de inclusión.
