title: Costo de salida
question: ¿Por qué las instituciones no se sueltan de una plataforma aunque
  exista una alternativa mejor o más barata?
body: |-
  Las instituciones no siguen atadas por precio ni por calidad, sino porque migrar es más caro que quedarse. La palanca real para soltarse son los identificadores persistentes (DOI, ORCID, ROR): un registro sin identificador propio no se puede mudar. Esta vista no es una consulta sobre el grafo — es una lista curada que contrasta la palanca (los identificadores) con ejemplos de plataformas cuya continuidad depende de una sola empresa.
