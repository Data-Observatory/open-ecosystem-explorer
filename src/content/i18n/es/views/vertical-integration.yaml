title: Integración vertical
question: ¿Qué grupos empresariales son dueños simultáneamente de un índice, un
  CRIS y un repositorio?
body: |-
  Los mismos grupos venden el índice, el CRIS y las métricas. Elsevier, Clarivate y Digital Science poseen, cada uno, un producto en las tres capas — índice, sistema institucional y repositorio — lo que concentra el ecosistema de información de investigación en manos de muy pocos propietarios. No se resuelve cambiando de proveedor dentro del mismo grupo.
