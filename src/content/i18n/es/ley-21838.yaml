summary: Ley chilena de septiembre de 2026 que crea un repositorio nacional a cargo de ANID y obliga a
  quienes investigan con fondos públicos a depositar su trabajo y sus datos.
shortName: Law 21.838
relationNotes:
  is-a@open-access-mandate: 'Art. 6: los investigadores con fondos públicos depositan el manuscrito aceptado
    y sus datos en un repositorio institucional o en el de ANID.'
  applies-to@anid: El art. 6 crea el repositorio nacional de conocimiento científico y tecnológico y lo
    deja a cargo de ANID.
  applies-to@ministerio-de-ciencia: 'Art. 7: junto con el Ministerio de Educación, promueve el acceso
    abierto a publicaciones, datos y código.'
  related-to@open-science: El art. 2 define la ciencia abierta y el art. 7 pide al Estado y a las universidades
    que la fomenten.
  related-to@open-access: 'Art. 7: fomenta el acceso abierto a publicaciones científicas, datos y código
    vinculados a la investigación.'
  related-to@research-repository: 'Art. 6: el repositorio nacional debe interoperar con los repositorios
    de investigación de las instituciones de educación superior.'
body: La Ley 21.838 se publicó el 17 de septiembre de 2026 y entra en vigor el 1 de marzo de 2027, el
  primer día del sexto mes posterior a su publicación. Trata sobre todo de transferencia de tecnología
  y conocimiento y permite a las instituciones de educación superior crear empresas de base científico-tecnológica.
  En ciencia abierta, el artículo 6 crea el Repositorio Nacional de Conocimiento e Información Científica
  y Tecnológica, público y gratuito, a cargo de ANID. También obliga a quienes investigan con fondos públicos
  a depositar la versión aceptada de sus artículos y sus datos de investigación en el repositorio de su
  institución o en el de ANID. El artículo 7 pide al Estado y a las instituciones de educación superior
  que promuevan la ciencia abierta. El Ministerio de Ciencia dicta los reglamentos, que deben salir dentro
  de seis meses desde la entrada en vigor de la ley.
