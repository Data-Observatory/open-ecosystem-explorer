summary: Digital Science es una empresa de tecnología para la investigación que posee
  Figshare, Dimensions y Symplectic Elements, entre otras herramientas.
relationNotes:
  owned-by@holtzbrinck: Propiedad total; Holtzbrinck también posee la mayoría (50,6%) de Springer Nature.
body: |-
  Digital Science es propiedad de Holtzbrinck y opera, entre otras, un índice bibliográfico, un CRIS comercial y una plataforma de repositorio.
