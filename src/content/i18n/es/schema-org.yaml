summary: Schema.org es un vocabulario compartido de etiquetas que permite a los buscadores
  web entender el contenido de una página.
relationNotes:
  governed-by@google: Desde 2026 lo dirige Google; el grupo comunitario del W3C es solo un foro de discusión.
  related-to@metadata-standard: Vocabulario compartido para marcar datos estructurados en
    páginas web.
body: |-
  schema.org define un vocabulario común para que buscadores web interpreten el contenido de una página, incluidos datasets y repositorios. No es una iniciativa del W3C: según su propio grupo comunitario, desde 2026 lo dirige directamente Google.
