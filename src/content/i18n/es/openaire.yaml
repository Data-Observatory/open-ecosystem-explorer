summary: OpenAIRE es una infraestructura europea que reúne el contenido de muchos
  repositorios y lo vincula con sus financiadores, para facilitar su búsqueda.
relationNotes:
  indexes@zenodo: OpenAIRE y Zenodo operan en colaboración estrecha desde el
    lanzamiento de Zenodo en 2013; OpenAIRE agrega y enlaza sus registros.
  member-of@barcelona-declaration: Figura como supporter en el sitio de la Declaración de Barcelona; OpenAIRE se presenta a sí misma como firmante.
  related-to@research-repository: 'Reúne contenido de repositorios institucionales y de otro tipo y lo vincula con datos de financiación.'
body: |-
  OpenAIRE agrega contenido de repositorios institucionales en Europa y lo conecta con datos de financiamiento.
