summary: Iniciativa latinoamericana no comercial de acceso abierto, vinculada a Redalyc, UNESCO y CLACSO.
relationNotes:
  related-to@diamond-open-access: Promueve un modelo de comunicación no comercial, de tipo diamante.
body: |-
  AmeliCA promueve un modelo de comunicación científica no comercial. Su sitio presenta a Redalyc, UNESCO y CLACSO como instituciones vinculadas, y UNESCO ha apoyado trabajo conjunto de AmeliCA y Redalyc UAEM, como una estrategia de acceso abierto no comercial en Angola.
