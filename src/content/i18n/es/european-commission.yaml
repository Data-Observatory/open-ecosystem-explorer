summary: La Comisión Europea es el órgano ejecutivo de la Unión Europea y financia
  infraestructuras de ciencia abierta como EOSC y OpenAIRE.
relationNotes:
  member-of@coara: 'Figura entre las organizaciones miembro de CoARA.'
body: |-
  La Comisión Europea financia directamente EOSC y OpenAIRE como parte de su estrategia de ciencia abierta, sin operarlos día a día.
