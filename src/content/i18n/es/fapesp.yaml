summary: Fundación pública de fomento a la investigación del estado de São
  Paulo; creó SciELO en 1997 y desde 2024 lo cofinancia con CAPES y CNPq.
body: |-
  Financió SciELO casi en solitario durante más de 26 años; desde agosto de 2024 lo sostiene junto con CAPES y CNPq mediante un consorcio nacional.
