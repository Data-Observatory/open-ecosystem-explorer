summary: Identificador persistente que resuelve el problema de que la misma
  persona investigadora aparezca escrita de formas distintas.
body: |-
  El ORCID iD es el identificador de persona más adoptado en la investigación mundial; permite enlazar de forma inequívoca a un investigador con sus publicaciones, datasets y financiamiento. Lo emite y opera ORCID, Inc., una organización sin fines de lucro independiente que administra el registro, mantiene los estándares de interoperabilidad y se financia con cuotas de membresía, sin depender de ninguna editorial o financiador.
