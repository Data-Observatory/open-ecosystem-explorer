summary: Un mandato de acceso abierto es una política que exige a investigadores depositar
  o publicar sus resultados en abierto, como condición de su financiamiento.
name: Mandato de acceso abierto
localNote: 'En Chile, ANID aprobó en 2022 una política de acceso abierto (Res. Ex.
  3906/2022): lo que financia debe depositarse en abierto dentro de seis meses de
  su publicación.'
body: |-
  Los mandatos los emiten financiadores o instituciones y suelen precisar qué debe depositarse o publicarse, dónde, cuándo y a veces con qué licencia. Plan S es un ejemplo destacado de un financiador.
