summary: Las guías de OpenAIRE son reglas para que repositorios, revistas y sistemas
  de información de investigación publiquen sus metadatos de forma que otros puedan
  leerlos.
relationNotes:
  is-a@metadata-standard: Perfil de aplicación de un estándar de metadatos.
body: |-
  Las guías de OpenAIRE definen perfiles de aplicación sobre Dublin Core para que repositorios, revistas y CRIS expongan sus metadatos de forma coherente.
