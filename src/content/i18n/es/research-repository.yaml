summary: Un repositorio de investigación es un servicio en línea que guarda, describe
  y da acceso a publicaciones o datos científicos para que otros los reutilicen.
name: Repositorio de investigación
body: |-
  Los repositorios de investigación conservan los objetos depositados a lo largo del tiempo y exponen metadatos descriptivos, normalmente con un identificador persistente por registro. Se distinguen por quién los opera (una institución, una disciplina, una empresa) y por lo que aceptan.
