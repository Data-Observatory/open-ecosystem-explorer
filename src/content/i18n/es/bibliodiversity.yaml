summary: La bibliodiversidad es la variedad de editores, idiomas, formatos y modelos
  de publicación que permite que el conocimiento circule sin depender de unos pocos
  actores.
name: Bibliodiversidad
localNote: El término se vincula con editores independientes de Chile y América Latina
  de los años noventa, aunque su origen exacto se discute.
relationNotes:
  related-to@open-science: La publicación diversa y multilingüe forma parte de la
    agenda de ciencia abierta.
body: |-
  El Llamado de Jussieu (2017) aplica el término a la publicación científica y defiende modelos diversos, no comerciales y multilingües. La Iniciativa de Helsinki sobre Multilingüismo aborda la dimensión lingüística de la misma preocupación.
