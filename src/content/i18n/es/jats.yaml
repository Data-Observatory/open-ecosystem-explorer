summary: Suite de etiquetado XML para artículos de revista, usada por SciELO y Redalyc.
relationNotes:
  related-to@metadata-standard: Formato XML para artículos que incluye su descripción bibliográfica.
body: |-
  JATS define cómo marcar en XML el contenido de un artículo de revista. SciELO lo usa como base de su SciELO Publishing Schema y Redalyc lo aplica con su herramienta de marcación Marcalyc.
