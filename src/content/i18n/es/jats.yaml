summary: Suite de etiquetado XML para artículos de revista; la capa de marcado
  sobre la que construyen SciELO y Redalyc.
relationNotes:
  related-to@metadata-standard: Formato XML para artículos que incluye su descripción
    bibliográfica.
body: |-
  JATS define cómo marcar en XML el contenido de un artículo de revista; SciELO y Redalyc lo usan, cada una en su propio dialecto.
