summary: Directorio global de repositorios de acceso abierto, en proceso de
  separación de los servicios Sherpa fusionados.
relationNotes:
  operated-by@jisc: Operado por Jisc.
  member-of@coar: COAR y Jisc publicaron una hoja de ruta conjunta para
    transicionar OpenDOAR hacia un directorio internacional de repositorios con
    gobernanza comunitaria.
body: |-
  OpenDOAR mantiene un directorio global de repositorios de acceso abierto, usado como referencia para identificar dónde depositar o buscar contenido institucional.
