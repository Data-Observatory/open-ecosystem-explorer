summary: OpenDOAR es un directorio mundial de repositorios de acceso abierto, para
  saber dónde depositar o buscar contenido.
relationNotes:
  operated-by@jisc: Operado por Jisc.
  member-of@coar: COAR y Jisc publicaron una hoja de ruta conjunta para
    transicionar OpenDOAR hacia un directorio internacional de repositorios con
    gobernanza comunitaria.
body: |-
  OpenDOAR mantiene un directorio global de repositorios de acceso abierto, usado como referencia para identificar dónde depositar o buscar contenido institucional. Está en proceso de separarse de los servicios Sherpa fusionados.
