summary: Coalición europea (2022) de instituciones que se comprometen a reformar
  los criterios de evaluación de la investigación.
relationNotes:
  related-to@research-assessment: Acuerdo para reformar cómo se evalúa la investigación.
body: |-
  CoARA nació de una recomendación de la Comisión Europea y trabaja en estrecha coordinación con DORA, aunque son coaliciones separadas.
