summary: El acceso abierto diamante es un modelo de publicación que no cobra a lectores
  ni a autores y que sostienen instituciones o fondos públicos.
name: Acceso abierto diamante
localNote: En América Latina es el modelo más extendido, apoyado en plataformas públicas
  sin fines de lucro como SciELO, Redalyc y AmeliCA.
body: |-
  El acceso abierto diamante es un subtipo de acceso abierto cuyos costos cubren instituciones, consorcios o fondos públicos, en lugar de cargos por publicación o suscripciones. Lo operan revistas, plataformas y consorcios; es un modelo, no una tecnología.
