summary: La soberanía de datos indígenas es el derecho de los pueblos indígenas a
  decidir cómo se recopilan, usan y comparten los datos que les conciernen.
name: Soberanía de datos indígenas
body: |-
  Los Principios CARE (beneficio colectivo, autoridad para controlar, responsabilidad y ética) son el marco más conocido para llevarla a la práctica, y complementan los principios FAIR al poner a las personas y su propósito primero.
