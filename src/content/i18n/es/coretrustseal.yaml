summary: Sello de certificación para repositorios confiables, alcanzable para un
  repositorio bien llevado.
relationNotes:
  profile-of@trust-principles: CoreTrustSeal convierte los principios TRUST en requisitos certificables.
body: |-
  CoreTrustSeal es la forma más rápida de que un tercero valide la seriedad de un repositorio, sin construir una certificación propia desde cero. Sus requisitos los mantiene la CoreTrustSeal Foundation, una fundación neerlandesa (Stichting) independiente desde 2018, con una junta electa de 12 miembros.
