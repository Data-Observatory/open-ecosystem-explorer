summary: Fundación danesa sin fines de lucro, gobernada por la comunidad, que
  dirige y gestiona DOAJ desde su traspaso desde IS4OA.
body: |-
  La DOAJ Foundation, con sede registrada en Roskilde (Dinamarca), es la entidad legal que gestiona DOAJ; su Junta de la Fundación y su Junta Asesora reúnen a bibliotecarios, editoriales, investigadores y financiadores. Sustituye a IS4OA, que gestionó DOAJ hasta la transición, completada a mediados de 2026.
