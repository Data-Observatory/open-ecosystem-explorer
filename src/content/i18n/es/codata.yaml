summary: Comité del International Science Council dedicado a datos,
  interoperabilidad, políticas y capacidades. Chile tiene comité nacional
  impulsado por Data Observatory.
relationNotes:
  member-of@rda: CODATA es Miembro Afiliado documentado de RDA; ambos organismos
    operan bajo un memorando de entendimiento con roles complementarios.
body: |-
  CODATA trabaja en interoperabilidad de datos entre dominios, y es la comunidad detrás de CDIF.
