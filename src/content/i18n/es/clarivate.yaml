summary: Clarivate es una empresa que ofrece el índice de citas Web of Science y los
  sistemas de gestión de la investigación Converis y Esploro.
body: |-
  Clarivate llegó a Esploro (CRIS de Ex Libris) a través de la adquisición de ProQuest en 2021. No hay anuncio de fin de vida de Converis; la convivencia de dos CRIS en el mismo portafolio es materia de comentario de mercado, no un hecho confirmado.
