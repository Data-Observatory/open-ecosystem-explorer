summary: El acceso abierto dorado es el de un artículo publicado en una revista cuyos artículos están
  todos abiertos en su sitio web.
localNote: En América Latina, SciELO y Redalyc actúan a la vez como editoras y repositorios, por lo que
  muchos de sus artículos no encajan bien en estas categorías.
body: En el acceso abierto dorado el artículo aparece en una revista de acceso abierto, en la que todos
  los artículos están abiertos en el propio sitio de la revista. En la práctica, estas revistas suelen
  identificarse por su inclusión en el Directorio de Revistas de Acceso Abierto (DOAJ). El acceso abierto
  diamante es el modelo sin cobro a autores ni a lectores.
