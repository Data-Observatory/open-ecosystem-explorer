summary: Declaración de 2012 contra el uso del factor de impacto de revista como
  sustituto de la calidad de un artículo individual.
relationNotes:
  endorsed-by@elsevier: Firmó en diciembre de 2020, tras años de presión de la comunidad.
  related-to@research-assessment: Declaración sobre cómo debe evaluarse la investigación.
body: |-
  DORA es la declaración fundacional del movimiento de reforma de la evaluación de la investigación, precursora de coaliciones más recientes como CoARA.
