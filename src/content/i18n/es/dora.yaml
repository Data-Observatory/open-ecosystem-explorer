summary: DORA es una declaración de 2012 que pide no juzgar un artículo por el factor
  de impacto (promedio de citas) de su revista.
relationNotes:
  endorsed-by@elsevier: Firmó en diciembre de 2020, tras años de presión de la comunidad.
  related-to@research-assessment: Declaración sobre cómo debe evaluarse la investigación.
body: |-
  DORA es la declaración que dio inicio al movimiento de reforma de la evaluación de la investigación; antecedió a coaliciones más recientes como CoARA.
