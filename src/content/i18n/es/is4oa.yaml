summary: Organización británica sin fines de lucro que gestionó DOAJ antes de su traspaso a la DOAJ Foundation, prevista para mediados de 2026.
body: |-
  IS4OA sostuvo DOAJ como índice curado de revistas de acceso abierto hasta que la operación pasó a la DOAJ Foundation. Según doaj.org/about, seguiría operando hasta mediados de 2026, cuando se completaría la transición; no hemos encontrado confirmación de su cierre.
