summary: 'Los principios CARE para la gobernanza de datos indígenas son principios, no un estándar: beneficio colectivo, autoridad para controlar, responsabilidad y ética.'
relationNotes:
  related-to@indigenous-data-sovereignty: Principios para llevar a la práctica la soberanía
    de datos indígenas.
  related-to@open-data: Pide que abrir datos respete también el beneficio colectivo
    y el control.
body: |-
  Los principios CARE para la gobernanza de datos indígenas son principios para gestionar datos de pueblos indígenas, no una norma técnica ni una certificación. Se redactaron en un taller en Gaborone en 2018, celebrado durante la Semana Internacional de los Datos y una Plenaria de RDA, y la Global Indigenous Data Alliance (GIDA) los publicó en 2019. CARE complementa a FAIR, no lo reemplaza: FAIR resuelve findability e interoperabilidad; CARE resuelve quién decide sobre datos que involucran a comunidades indígenas.
