summary: Organización estadounidense de normalización en información, acreditada ante ANSI; mantiene JATS.
body: |-
  NISO produce normas y prácticas recomendadas del sector de la información, incluida la suite de etiquetado JATS, en la que se basan el esquema de marcado de SciELO y la herramienta Marcalyc de Redalyc.
