summary: Consejo internacional no gubernamental de centros de ciencias sociales, artes y humanidades,
  creado en 1967, con sede en Buenos Aires.
body: CLACSO, el Consejo Latinoamericano de Ciencias Sociales, Artes y Humanidades, es una institución
  internacional no gubernamental con estatus asociativo en la UNESCO, creada en 1967. Reúne centros de
  investigación y de posgrado en ciencias sociales y humanidades de América Latina y otros continentes,
  y su Secretaría Ejecutiva está en Buenos Aires. Impulsa FOLEC, su foro sobre evaluación de la investigación.
