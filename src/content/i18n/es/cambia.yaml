summary: Fundación sin fines de lucro que gestionó The Lens hasta junio de 2026, cuando lo vendió.
body: |-
  Cambia gestionó The Lens, un servicio que, según la propia organización, ofrece conocimiento global de patentes y de literatura académica como recurso público. El 1 de junio de 2026 anunció la venta del negocio y los activos de The Lens a una organización sin fines de lucro con sede en Australia que ahora pertenece a SPIE (véase The Lens).
