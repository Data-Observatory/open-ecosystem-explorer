summary: POSI es un conjunto de 20 principios sobre la gobernanza, la sostenibilidad y el aseguramiento de las organizaciones que operan infraestructura académica. No es un estándar.
body: |-
  Los Principios de Infraestructura Académica Abierta (POSI, por sus siglas en inglés) son principios para las organizaciones que operan infraestructura académica, no una norma técnica ni una certificación. La versión 2.0 (octubre de 2025) tiene 20 principios en tres grupos: gobernanza (incluye un «testamento en vida» para el caso de que la organización cierre), sostenibilidad y aseguramiento (código abierto, datos abiertos y seguros, no afirmación de patentes e interoperabilidad con estándares abiertos). Las organizaciones los adoptan publicando una autoauditoría y comprometiéndose a mostrar evidencia de que los siguen; Crossref los adoptó por voto de directorio y ha publicado autoevaluaciones periódicas (2020, 2022 y 2024).
