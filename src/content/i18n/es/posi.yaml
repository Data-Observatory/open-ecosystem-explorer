summary: Criterio de gobernanza que evalúa gobernanza, sostenibilidad y seguros — qué pasaría si la organización desaparece, si el código es abierto y si los datos se pueden replicar.
body: |-
  POSI sirve para decidir de quién depender, no para autoproclamarse. Crossref lo adoptó por voto de directorio y ha publicado autoevaluaciones periódicas (2020, 2022 y 2024).
