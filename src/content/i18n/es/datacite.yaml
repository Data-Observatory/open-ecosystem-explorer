summary: Agencia de registro de DOI sin fines de lucro orientada a datasets,
  software, informes y plataformas de investigación.
relationNotes:
  member-of@barcelona-declaration: Figura entre los supporters de la Declaración (no entre los firmantes).
  issues@doi: €2.000 de membresía más una cuota de infraestructura de €200-700
    ajustada por contexto; sin cargo por DOI bajo 100.000/año.
  issues@igsn: El IGSN para muestras físicas se emite como un tipo de registro de DataCite.
body: |-
  DataCite trabaja con consorcios nacionales, el modelo que usa Data Observatory, y acuña el DOI para datasets y otros objetos de investigación.
