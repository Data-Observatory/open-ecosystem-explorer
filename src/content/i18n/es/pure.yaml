summary: CRIS comercial de Elsevier, uno de los sistemas de información de
  investigación más usados por universidades.
body: |-
  Pure es el CRIS de Elsevier (RELX), la misma matriz que posee Scopus, Interfolio y Digital Commons — un índice, un CRIS, un sistema de gestión académica y una plataforma de repositorio bajo un mismo propietario.
