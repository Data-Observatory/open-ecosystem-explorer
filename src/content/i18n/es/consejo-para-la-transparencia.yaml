summary: Organismo público autónomo chileno creado por la Ley 20.285 para promover la transparencia y
  garantizar el derecho de acceso a la información pública.
shortName: Transparency Council
body: El Consejo para la Transparencia es una corporación autónoma de derecho público, con personalidad
  jurídica y patrimonio propio, creada por el artículo 31 de la Ley 20.285. Tiene por objeto promover
  la transparencia de la función pública, fiscalizar el cumplimiento de las normas sobre transparencia
  y publicidad de la información, y garantizar el derecho de acceso a la información. Entre sus funciones
  está resolver los reclamos por denegación de acceso a la información.
