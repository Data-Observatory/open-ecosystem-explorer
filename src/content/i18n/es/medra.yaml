summary: Agencia regional europea de registro de DOI, orientada principalmente a
  publicaciones.
relationNotes:
  issues@doi: Agencia regional de DOI para publicaciones, con foco en Europa multilingüe.
body: |-
  mEDRA es una de las agencias regionales de DOI mencionadas junto a JaLC; hoy es poco relevante para el contexto chileno.
