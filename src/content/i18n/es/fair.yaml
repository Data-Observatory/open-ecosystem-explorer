summary: Principios que exigen que un dato pueda encontrarse, describirse,
  conectarse y reutilizarse, dejando el nivel de acceso a quien lo custodia.
relationNotes:
  related-to@research-data-management: Principios para gestionar datos de investigación
    de modo que puedan reutilizarse.
  related-to@open-data: Los datos FAIR no tienen que ser abiertos; la apertura es una
    decisión aparte.
  related-to@metadata: La localización y la interoperabilidad dependen de metadatos
    ricos.
body: |-
  FAIR no es una norma técnica ni exige apertura. Esa separación entre acceso y descripción es la herramienta más útil para hablar con instituciones públicas sobre datos sensibles sin pedirles que los abran.
