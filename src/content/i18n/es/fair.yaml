summary: Los principios FAIR son pautas para que los datos sean fáciles de encontrar,
  accesibles, compatibles entre sistemas y reutilizables, sin exigir que sean abiertos.
relationNotes:
  related-to@research-data-management: Principios para gestionar datos de investigación
    de modo que puedan reutilizarse.
  related-to@open-data: Los datos FAIR no tienen que ser abiertos; la apertura es una
    decisión aparte.
  related-to@metadata: La localización y la interoperabilidad dependen de metadatos
    ricos.
body: |-
  FAIR no es una norma técnica ni exige apertura: separa el acceso, que decide quien custodia los datos, de su descripción. Por eso puede aplicarse también a datos sensibles que no se pueden abrir.
