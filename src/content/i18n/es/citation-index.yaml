summary: Un índice de citas es una base de datos que registra qué publicaciones citan
  a cuáles, para rastrear la influencia de un trabajo.
name: Índice de citas
body: |-
  Como cada registro se define por sus enlaces de citas, un índice de citas puede mostrar qué trabajos se apoyan en cuáles. La cobertura y la apertura difieren mucho entre índices de citas comerciales y abiertos.
