summary: ONG que canaliza inversión de financiadores hacia infraestructura de
  investigación abierta, en vez de operar infraestructura propia.
relationNotes:
  funded-by@digital-science: Aporte de 2.7M USD junto a Wellcome para el fondo de adopción en red de IOI.
body: |-
  IOI funciona como intermediario: recibe financiamiento de fundaciones y empresas del sector y lo redirige hacia infraestructura ya existente.
