summary: Una licencia abierta es un permiso legal estándar que autoriza a cualquiera
  a usar, modificar y compartir una obra con condiciones mínimas, como citar.
name: Licencia abierta
body: |-
  Licencias como las de la familia Creative Commons dan de antemano el permiso legal de reutilización, por lo que quien reutiliza no necesita pedirlo. La Definición de Abierto mantiene la lista de licencias que la cumplen.
