summary: 'Ley chilena de transparencia de 2008: los actos del Estado y la información elaborada con presupuesto
  público son públicos, salvo excepción legal.'
shortName: Law 20.285
relationNotes:
  governed-by@consejo-para-la-transparencia: Su Consejo para la Transparencia fiscaliza el cumplimiento
    y resuelve los reclamos por denegación de acceso (arts. 31 a 33).
body: La Ley 20.285 se publicó el 20 de agosto de 2008. Su artículo 5 declara públicos los actos y resoluciones
  de los órganos de la Administración del Estado, sus fundamentos y los documentos que los sustentan,
  y también la información elaborada con presupuesto público o que obre en poder de esos órganos, en cualquier
  formato, salvo las excepciones legales. Creó el Consejo para la Transparencia (artículo 31), que promueve
  la transparencia, fiscaliza el cumplimiento y garantiza el derecho de acceso a la información. Trata
  de información pública en poder del Estado; por sí sola no fija una licencia ni un formato de datos,
  y en eso se distingue de los datos abiertos.
