summary: Agencia de registro de DOI sin fines de lucro orientada a publicaciones
  académicas, equivalente de DataCite para artículos.
relationNotes:
  member-of@barcelona-declaration: Figura entre los supporters de la Declaración (no entre los firmantes).
  issues@doi: DOI para publicaciones académicas, registrado normalmente a través
    de la revista o editorial.
  complies-with@posi: Adoptado por voto de directorio de Crossref en 2020; publica
    autoevaluaciones periódicas contra POSI.
body: |-
  Crossref tiene el programa GEM, que da membresía y registro sin costo a organizaciones de 93 países elegibles a partir de septiembre de 2026; Chile no está en esa lista.
