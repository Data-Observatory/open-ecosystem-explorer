summary: Identifica un proyecto o actividad de investigación, no su resultado;
  norma ISO 23527:2022 operada por ARDC.
relationNotes:
  governed-by@ardc: ARDC es la autoridad de registro designada por ISO para RAiD a nivel mundial.
  depends-on@datacite: ARDC y DataCite entregan RAiD conjuntamente; el registro
    ocurre a través de la infraestructura de Consorcio de DataCite.
body: |-
  RAiD interesa mucho a países sin CRIS nacional, porque permite identificar la actividad de investigación sin construir un sistema completo.
