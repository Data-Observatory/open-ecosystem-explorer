summary: La evaluación de la investigación es el proceso que juzga la calidad e impacto
  de proyectos, personas o instituciones para decidir financiamiento y ascensos.
name: Evaluación de la investigación
body: |-
  La forma de evaluar la investigación condiciona qué publican los investigadores y dónde. Iniciativas de reforma como DORA y CoARA piden evaluar según la calidad del trabajo mismo y no solo por métricas de revista.
