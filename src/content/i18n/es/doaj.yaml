summary: Índice curado por comunidad de revistas de acceso abierto evaluadas,
  operado por IS4OA.
relationNotes:
  operated-by@is4oa: Operado por IS4OA (Infrastructure Services for Open Access).
body: |-
  DOAJ mantiene un directorio curado de revistas de acceso abierto que cumplen criterios editoriales y de transparencia definidos.
