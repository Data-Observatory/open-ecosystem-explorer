summary: Índice curado por comunidad de revistas de acceso abierto evaluadas, operado por la DOAJ Foundation.
relationNotes:
  operated-by@doaj-foundation: Dirigido y gestionado por la DOAJ Foundation, una fundación danesa sin fines de lucro.
  operated-by@is4oa: Anterior organización gestora; la operación pasó a la DOAJ Foundation. Según doaj.org/about, IS4OA seguiría operando hasta mediados de 2026, cuando se completaría la transición; no hemos encontrado confirmación de su cierre.
  related-to@open-access: Directorio de revistas de acceso abierto que cumplen sus criterios.
body: |-
  DOAJ mantiene un directorio curado de revistas de acceso abierto que cumplen criterios editoriales y de transparencia definidos.
