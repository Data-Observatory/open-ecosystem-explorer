summary: Sistema regional iberoamericano de información sobre revistas
  científicas, red cooperativa desde 1997.
relationNotes:
  interoperates-with@redalyc: Declaración conjunta Latindex-Redalyc-CLACSO-IBICT
    sobre licenciamiento CC BY-NC-SA para las revistas de acceso abierto de la
    región.
body: |-
  Latindex es una red cooperativa de centros nacionales que evalúa y visibiliza revistas científicas iberoamericanas desde 1997.
