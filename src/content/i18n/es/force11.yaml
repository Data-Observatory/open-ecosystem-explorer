summary: Comunidad de comunicación académica en la que se redactaron y
  difundieron los principios FAIR.
relationNotes:
  related-to@fair: Los principios orientadores FAIR se redactaron y difundieron en esta comunidad.
body: |-
  FORCE11 es el espacio donde se gestó y difundió públicamente el marco de principios FAIR, entre otras iniciativas de comunicación científica.
