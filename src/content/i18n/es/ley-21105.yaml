summary: Ley chilena de 2018 que creó el Ministerio de Ciencia y ANID, la agencia que ejecuta los programas
  de financiamiento de la investigación.
shortName: Law 21.105
relationNotes:
  applies-to@ministerio-de-ciencia: Crea el Ministerio de Ciencia, Tecnología, Conocimiento e Innovación.
  applies-to@anid: El art. 11 crea ANID como servicio público descentralizado que se relaciona con la
    Presidencia a través del Ministerio.
body: La Ley 21.105 se publicó el 13 de agosto de 2018. Creó el Ministerio de Ciencia, Tecnología, Conocimiento
  e Innovación y, en su artículo 11, la Agencia Nacional de Investigación y Desarrollo (ANID) como servicio
  público descentralizado, con personalidad jurídica y patrimonio propio, que se relaciona con la Presidencia
  a través del Ministerio. ANID tiene por objeto administrar y ejecutar los programas e instrumentos que
  promueven la investigación en todas las áreas del conocimiento.
