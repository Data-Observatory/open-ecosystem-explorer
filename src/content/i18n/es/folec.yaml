summary: Foro de CLACSO para debatir cómo se evalúa la investigación en América Latina y el Caribe, con
  inicio formal en noviembre de 2019.
shortName: FOLEC
relationNotes:
  governed-by@clacso: Un foro de CLACSO; su inicio formal fue en la Ciudad de México en noviembre de 2019.
  related-to@research-assessment: Debate el sentido, las políticas y las prácticas de la evaluación de
    la investigación en América Latina.
body: FOLEC es un espacio de debate sobre el sentido, las políticas y las prácticas de la evaluación de
  la investigación en la región, desde una perspectiva abierta, colaborativa y pública del conocimiento.
  Su inicio formal fue el primer seminario latinoamericano sobre evaluación de la investigación, realizado
  en la Ciudad de México en noviembre de 2019 y coorganizado por CLACSO. En 2020 elaboró diagnósticos,
  propuestas y principios orientadores para la reforma de la evaluación, y en 2021 se realizó un segundo
  foro junto con el CONICET de Argentina. Es un foro y una declaración de principios, no una coalición
  cuyos firmantes informen avances.
