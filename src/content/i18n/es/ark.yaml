summary: Esquema de identificador persistente libre de costo, con registro de
  NAAN y resolutor N2T estewardado por la ARK Alliance.
relationNotes:
  funded-by@lyrasis: La ARK Alliance, gobernada por la comunidad, cuenta con el apoyo en parte de LYRASIS.
body: |-
  ARK es una alternativa al DOI sin costo de emisión, popular en bibliotecas, archivos y algunos repositorios de datos. Lo gobierna la ARK Alliance, una comunidad técnica que coordina a las instituciones emisoras y mantiene el registro de NAAN y el resolutor N2T.
