summary: La Linux Foundation es una organización sin fines de lucro 501(c)(6) de EE. UU. que aloja proyectos de tecnología abierta, entre ellos SPDX.
relationNotes:
  related-to@open-source-software: Anfitrión neutral de proyectos de tecnología abierta.
body: |-
  Se describe como un centro neutral y de confianza donde desarrolladores programan, gestionan y escalan proyectos de tecnología abierta. SPDX es uno de los proyectos de código abierto que aloja.
