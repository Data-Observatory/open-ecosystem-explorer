summary: SCOSS es una coalición de bibliotecas, financiadores y consorcios que aportan
  fondos para sostener servicios de ciencia abierta ya existentes.
body: |-
  SCOSS agrupa a bibliotecas, agencias financiadoras y consorcios para cubrir vacíos de financiamiento de servicios de código abierto ya existentes, en vez de crear infraestructura nueva.
