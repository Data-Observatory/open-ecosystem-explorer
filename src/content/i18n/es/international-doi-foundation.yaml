summary: Organización sin fines de lucro que gobierna el sistema DOI y es la
  autoridad de registro de la norma ISO 26324.
body: |-
  La IDF fija la política y los estándares técnicos del DOI; las agencias de registro (Crossref, DataCite, mEDRA, JaLC, entre otras) ocupan asientos en su junta directiva y compiten para prestar el servicio de registro a distintas comunidades y regiones.
