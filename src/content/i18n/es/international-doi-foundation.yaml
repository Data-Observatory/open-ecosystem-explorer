summary: Organización sin fines de lucro que gobierna el sistema DOI y es la autoridad de registro de la norma ISO 26324.
body: |-
  La IDF fija la política y los estándares técnicos del DOI. Su junta directiva, elegida por los miembros de la fundación, reúne a agencias de registro (Crossref, DataCite, mEDRA, JaLC, entre otras) y a otros miembros.
