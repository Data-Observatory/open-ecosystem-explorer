summary: La Carta de Datos Abiertos es una red que ayuda a los gobiernos a adoptar seis principios de datos abiertos, el primero, abierto por defecto.
name: Carta Internacional de los Datos Abiertos
relationNotes:
  related-to@open-data: Principios para publicar datos de gobierno de forma abierta.
body: |-
  Los principios se elaboraron en 2015 con gobiernos, sociedad civil y personas expertas. Según su sitio, más de 29 gobiernos nacionales y 146 subnacionales y ciudades los han adoptado.
localNote: Chile figura entre los signatarios originales, cuando la Carta se adoptó en octubre de 2015 en México.
