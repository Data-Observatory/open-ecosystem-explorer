summary: Instrumento global adoptado por los estados miembro de UNESCO en 2021;
  de carácter asesor, y el texto de referencia que citan la mayoría de las
  políticas regionales.
relationNotes:
  mandates@fair: Solo asesor; nombra FAIR (y CARE) como principios orientadores para los datos y la infraestructura abiertos, sin crear una obligación vinculante.
body: |-
  Es advisory, no vinculante, pero funciona como el marco común al que las políticas nacionales — como la de ANID en Chile — hacen referencia.
