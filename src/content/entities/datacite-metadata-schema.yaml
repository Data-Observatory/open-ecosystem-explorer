type: standard
name: DataCite Metadata Schema
url: https://schema.datacite.org/
status: active
governance: nonprofit
standardKind: metadata-schema
specVersion: "4.6"
machineReadable: true
requiresOpenness: false
identifiers:
  wikidata: Q105762834
tags:
  - function:registration
lastReviewed: 2026-09-03
relations:
  - predicate: governed-by
    target: datacite
  - predicate: depends-on
    target: doi
  - predicate: depends-on
    target: orcid
    note: ORCID is a documented supported nameIdentifierScheme value for the
      Creator/Contributor properties.
  - predicate: is-a
    target: metadata-standard
  - predicate: depends-on
    target: ror
    note: 'ROR is a documented supported affiliationIdentifierScheme value for creator and contributor affiliations.'
    sources:
      - url: https://datacite-metadata-schema.readthedocs.io/en/4.6/properties/creator/
        accessed: 2026-11-13
        note: 'Creator affiliationIdentifier example https://ror.org/04aj4c181; affiliationIdentifierScheme lists ROR.'
sources:
