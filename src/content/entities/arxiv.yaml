url: https://arxiv.org/
status: active
governance: nonprofit
codebase: mixed
outputLicence: open
platformKind: preprint-server
fullTextHosted: true
admissionCriteria: published
identifiers:
  ror: 00m2zh467
  wikidata: Q118398
tags:
  - function:deposit
  - openness:open-content
lastReviewed: 2026-11-12
note: Spun out from Cornell University on 2026-07-01 to become an independent
  nonprofit; historical operated-by/funded-by edges to Cornell are dated `until`
  the spin-out. Governed since then by arXiv, Inc., a US (Delaware) nonprofit,
  nonstock corporation with its own board (8 inaugural members, up to 4 more);
  Cornell and the Simons Foundation are founding Members.
relations:
  - predicate: operated-by
    target: cornell
    until: 2026-06
    note: Hosted at Cornell for 25 years, ending with the 2026-07-01 spin-out to
      independent nonprofit status.
  - predicate: funded-by
    target: cornell
    until: 2026-06
    note: One of several funders prior to the 2026 spin-out.
  - predicate: funded-by
    target: simons-foundation
    note: Long-standing funder; contributed to a $10M gift (with Schmidt Sciences)
      funding the post-spin-out cloud migration.
    verified:
      date: 2026-09-04
      url: https://blog.arxiv.org/2026/06/30/arxivs-next-chapter/
  - predicate: funded-by
    target: schmidt-sciences
    note: Contributed to a $10M gift (with the Simons Foundation) funding the
      post-spin-out cloud migration.
    verified:
      date: 2026-09-04
      url: https://blog.arxiv.org/2026/06/30/arxivs-next-chapter/
  - predicate: implements
    target: oai-pmh
    note: arXiv exposes its metadata through OAI-PMH; its early-implementer role is
      unverified here.
  - predicate: funded-by
    target: scoss
    note: SCOSS-funded infrastructure among its several funding sources.
    verified:
      date: 2026-09-04
      url: https://scoss.org/what-is-scoss/
  - predicate: related-to
    target: preprint
    note: Server that hosts preprints; it is a platform, not a preprint.
  - predicate: member-of
    target: datacite
    note: 'Direct member of DataCite.'
    sources:
      - url: https://api.datacite.org/providers/arxiv
        accessed: 2026-11-13
        note: 'DataCite''s own provider record: memberType direct_member.'
      - url: https://www.wikidata.org/wiki/Q118398#P463
        accessed: 2026-11-13
sources:
