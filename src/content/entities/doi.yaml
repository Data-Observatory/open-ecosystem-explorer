      date: 2026-09-06
      url: https://www.dona.net/faq
  - predicate: is-a
    target: persistent-identifier
sources:
  - url: https://portalinnova.cl/biblioteca-del-congreso-nacional-firma-convenio-con-data-observatory-para-integrar-el-consorcio-datacite/
    accessed: 2026-11-12
    note: Chile; Data Observatory leads a DataCite consortium; Biblioteca del Congreso Nacional joined it to assign DOIs (article of 2026-03-25).
  - url: https://www.doi.org/the-identifier/what-is-a-doi/
    accessed: 2026-09-03
  - url: https://www.doi.org/the-foundation/board-and-governance/
    accessed: 2026-09-04
  - url: https://www.dona.net/faq
    accessed: 2026-09-06
    note: Confirms IDF is a credentialed Multi-Primary Administrator (MPA) of the
      Global Handle Registry alongside CNRI — i.e. DOI is a governed application
