type: agency
name: Crossref
url: https://www.crossref.org
status: active
governance: nonprofit
since: "2000"
registers:
  - publication
feeModel: membership
consortiumModel: false
waiverProgramme: GEM programme — 79 eligible countries on the 2026 list (18 added in
  January 2026), membership and content-registration fees waived (Similarity Check and Metadata Plus still
  charged); Chile is not eligible.
prominence: core
tags:
  - function:registration
  - region:global
lastReviewed: 2026-11-12
relations:
  - predicate: issues
    target: doi
    note: DOIs for scholarly publications, registered via the publisher or journal.
  - predicate: complies-with
    target: posi
    note: Adopted by Crossref board vote in 2020; publishes periodic POSI
      self-assessments.
  - predicate: depends-on
    target: handle-system
    note: Registers DOI-to-URL mappings into the Global Handle Registry, making
      doi.org resolution work regardless of registration agency.
    verified:
      date: 2026-09-06
      url: https://www.doi.org/the-identifier/resources/factsheets/doi-system-and-the-handle-system
  - predicate: member-of
    target: barcelona-declaration
    note: Listed as a supporter (infrastructure provider), not as a signatory.
    verified:
      date: 2026-11-12
      url: https://barcelona-declaration.org/signatories/
sources:
  - url: https://www.crossref.org/gem/
    accessed: 2026-11-12
    note: Lists 79 eligible countries (as of 2026); 18 added in January 2026; Chile not listed.
  - url: https://www.crossref.org/blog/the-gem-program-year-three-and-program-expansion-for-2026/
    accessed: 2026-11-12
    note: Expansion for 2026 took effect on 1 January 2026; 18 new countries, Chile not included.
  - url: https://www.crossref.org/blog/crossrefs-board-votes-to-adopt-the-principles-of-open-scholarly-infrastructure/
    accessed: 2026-09-04
  - url: https://www.doi.org/the-identifier/resources/factsheets/doi-system-and-the-handle-system
    accessed: 2026-09-06
  - url: https://barcelona-declaration.org/signatories/
    accessed: 2026-11-12
    note: Lists the organisation under Supporters (providers of data, services
      and infrastructure).
